name: Deploy to GitHub Pages

# 手动触发静态部署；生成与定时部署由 generate-and-deploy.yml 负责
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '部署原因 (可选, 仅作记录)'
        required: false
        default: 'manual deploy'

env:
  RESONOTE_BASE: /resonote/
  RESONOTE_SITE: https://doublemice.github.io

# 同一时间只允许一个 deploy
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Verify standalone repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.fork')" = "false"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore episode build cache
        uses: actions/cache@v5
        with:
          path: .cache/episode-builds
          key: resonote-episode-builds-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            resonote-episode-builds-v1-${{ runner.os }}-

      - name: Install playwright-chromium browser binaries
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm test

      - name: Validate episode metadata
        run: pnpm run normalize:meta

      - name: Validate generated artifacts
        run: pnpm run validate:artifacts

      - name: Build all (slidev episodes + Astro landing)
        run: pnpm run build

      - name: Audit independent brand identity
        run: pnpm run audit:brand

      - name: Audit home interactions and responsive layout
        run: pnpm run audit:home

      - name: Verify slide routing
        run: pnpm run verify:routing

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
