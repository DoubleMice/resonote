name: Generate and Deploy

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source id to generate; empty means all sources'
        required: false
        default: ''
      limit:
        description: 'Maximum episodes to generate'
        required: true
        default: '4'
      transcribe_limit:
        description: 'Maximum missing-transcript episodes to process'
        required: true
        default: '3'
      transcribe_wait_minutes:
        description: 'Minutes to wait for ASR completion before continuing'
        required: true
        default: '2'
      category:
        description: 'Optional category filter'
        required: false
        default: ''

env:
  RESONOTE_BASE: /resonote/
  RESONOTE_SITE: https://doublemice.github.io
  ANTHROPIC_BASE_URL: ${{ vars.CONTENT_BASE_URL || 'https://api.xiaomimimo.com/anthropic' }}
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  ANTHROPIC_MODEL: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  CONTENT_EFFORT: ${{ vars.CONTENT_EFFORT }}
  ENABLE_TOOL_SEARCH: 'true'

concurrency:
  group: content-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify standalone repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.fork')" = "false"

      - name: Sync latest branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore episode build cache
        uses: actions/cache@v5
        with:
          path: .cache/episode-builds
          key: resonote-episode-builds-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            resonote-episode-builds-v1-${{ runner.os }}-

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install playwright-chromium browser binaries
        run: pnpm exec playwright install --with-deps chromium

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify MiMo content generation token
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.CONTENT_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_AUTH_TOKEN}" ]; then
            echo "CONTENT_API_KEY secret is required for content generation"
            exit 1
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Refresh RSS cache
        run: pnpm run cache:refresh

      - name: Generate plans
        run: pnpm run plan

      - name: Generate episodes
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.CONTENT_API_KEY }}
          TRANSCRIPT_PROVIDER: ${{ vars.TRANSCRIPTION_PROVIDER }}
          MIMO_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          MIMO_BASE_URL: ${{ vars.TRANSCRIPTION_BASE_URL }}
          MIMO_MODEL: ${{ vars.TRANSCRIPTION_MODEL_NAME }}
          MIMO_MAX_COMPLETION_TOKENS: ${{ vars.TRANSCRIPTION_MAX_COMPLETION_TOKENS }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          limit="${{ inputs.limit || '4' }}"
          transcribe_limit="${{ inputs.transcribe_limit || '3' }}"
          transcribe_wait_minutes="${{ inputs.transcribe_wait_minutes || '2' }}"
          source="${{ inputs.source || '' }}"
          category="${{ inputs.category || '' }}"
          provider="${TRANSCRIPT_PROVIDER:-mimo}"
          args=(--limit=${limit})
          if [ "${provider}" = "mimo" ] && [ -n "${MIMO_API_KEY}" ]; then
            args+=(--auto-transcribe --transcribe-limit=${transcribe_limit} --transcribe-wait-minutes=${transcribe_wait_minutes})
          elif [ "${provider}" = "dashscope" ] && [ -n "${DASHSCOPE_API_KEY}" ]; then
            args+=(--auto-transcribe --transcribe-limit=${transcribe_limit} --transcribe-wait-minutes=${transcribe_wait_minutes})
          else
            echo "Transcript provider ${provider} is not configured; skipping auto transcription"
          fi
          if [ -n "${source}" ]; then
            args+=(--id=${source})
          fi
          if [ -n "${category}" ]; then
            args+=(--category=${category})
          fi
          pnpm run plan:run -- "${args[@]}"

      - name: Normalize generated metadata
        run: pnpm run normalize:meta -- --fix

      - name: Validate generated artifacts
        run: pnpm run validate:artifacts

      - name: Build all
        run: pnpm run build

      - name: Audit independent brand identity
        run: pnpm run audit:brand

      - name: Audit home interactions and responsive layout
        run: pnpm run audit:home

      - name: Verify slide routing
        run: pnpm run verify:routing

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plans data/transcripts data/transcription-jobs.yml episodes README.md sources.yml package.json pnpm-lock.yaml .github/workflows
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "auto: generate rss episode"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
