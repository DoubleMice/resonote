name: Generate and Deploy

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source id to generate; empty means all sources'
        required: false
        default: ''
      episode:
        description: 'Optional exact episode id'
        required: false
        default: ''
      retry_failed:
        description: 'Retry failed generation and bypass transcription cooldown'
        type: boolean
        default: false
      limit:
        description: 'Maximum episodes to generate'
        required: true
        default: '4'
      transcribe_limit:
        description: 'Maximum missing-transcript episodes to process'
        required: true
        default: '3'
      transcribe_wait_minutes:
        description: 'Minutes to wait for ASR completion before continuing'
        required: true
        default: '2'
      category:
        description: 'Optional category filter'
        required: false
        default: ''

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  RESONOTE_BASE: /
  RESONOTE_SITE: https://resonote.doublemice.top
  CONTENT_PROVIDER: ${{ vars.CONTENT_PROVIDER || 'auto' }}
  CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL || 'https://api.xiaomimimo.com/anthropic' }}
  CONTENT_MODEL_NAME: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  ANTHROPIC_BASE_URL: ${{ vars.CONTENT_BASE_URL || 'https://api.xiaomimimo.com/anthropic' }}
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  ANTHROPIC_MODEL: ${{ vars.CONTENT_MODEL_NAME || 'mimo-v2.5' }}
  CONTENT_EFFORT: ${{ vars.CONTENT_EFFORT }}
  ENABLE_TOOL_SEARCH: 'true'

concurrency:
  group: content-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify standalone repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.fork')" = "false"

      - name: Sync latest branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Select content CLI
        id: content-cli
        run: pnpm exec tsx -e 'import { contentProvider } from "./scripts/lib/content-runner.ts"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_OUTPUT!, `provider=${contentProvider()}\n`)'

      - name: Install Codex CLI
        if: steps.content-cli.outputs.provider == 'codex'
        run: |
          npm install -g @openai/codex@0.153.4
          # Use Ubuntu's bubblewrap with its AppArmor user-namespace profile.
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Install Claude Code CLI
        if: steps.content-cli.outputs.provider == 'claude'
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify Codex content sandbox
        if: steps.content-cli.outputs.provider == 'codex'
        run: |
          codex sandbox -c 'sandbox_mode="workspace-write"' -c 'sandbox_workspace_write.network_access=true' -- \
            node -e 'const server = require("node:net").createServer(); server.on("error", error => { console.error(error); process.exitCode = 1 }); server.listen(0, "127.0.0.1", () => { console.log("Content sandbox can start the Slidev audit server"); server.close() })'

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install playwright-chromium browser binaries
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Verify content generation token
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.CONTENT_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_AUTH_TOKEN}" ]; then
            echo "CONTENT_API_KEY secret is required for content generation"
            exit 1
          fi

      - name: Refresh RSS cache
        run: pnpm run cache:refresh

      - name: Generate plans
        run: pnpm run plan

      - name: Generate episodes
        id: generation
        continue-on-error: true
        env:
          GENERATE_LIMIT: ${{ inputs.limit || '4' }}
          TRANSCRIBE_LIMIT: ${{ inputs.transcribe_limit || '3' }}
          TRANSCRIBE_WAIT_MINUTES: ${{ inputs.transcribe_wait_minutes || '2' }}
          GENERATE_SOURCE: ${{ inputs.source }}
          GENERATE_EPISODE: ${{ inputs.episode }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          GENERATE_CATEGORY: ${{ inputs.category }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.CONTENT_API_KEY }}
          TRANSCRIPT_PROVIDER: ${{ vars.TRANSCRIPTION_PROVIDER }}
          MIMO_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          MIMO_BASE_URL: ${{ vars.TRANSCRIPTION_BASE_URL }}
          MIMO_MODEL: ${{ vars.TRANSCRIPTION_MODEL_NAME }}
          MIMO_MAX_COMPLETION_TOKENS: ${{ vars.TRANSCRIPTION_MAX_COMPLETION_TOKENS }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          limit="${GENERATE_LIMIT}"
          transcribe_limit="${TRANSCRIBE_LIMIT}"
          transcribe_wait_minutes="${TRANSCRIBE_WAIT_MINUTES}"
          source="${GENERATE_SOURCE}"
          category="${GENERATE_CATEGORY}"
          provider="${TRANSCRIPT_PROVIDER:-mimo}"
          args=(--limit=${limit})
          if [ -n "${GENERATE_EPISODE}" ]; then
            args+=(--episode="${GENERATE_EPISODE}")
          fi
          if [ "${RETRY_FAILED}" = "true" ]; then
            args+=(--retry-failed)
          fi
          if [ "${provider}" = "mimo" ] && [ -n "${MIMO_API_KEY}" ]; then
            args+=(--auto-transcribe --transcribe-limit=${transcribe_limit} --transcribe-wait-minutes=${transcribe_wait_minutes})
          elif [ "${provider}" = "dashscope" ] && [ -n "${DASHSCOPE_API_KEY}" ]; then
            args+=(--auto-transcribe --transcribe-limit=${transcribe_limit} --transcribe-wait-minutes=${transcribe_wait_minutes})
          else
            echo "Transcript provider ${provider} is not configured; skipping auto transcription"
          fi
          if [ -n "${source}" ]; then
            args+=(--id=${source})
          fi
          if [ -n "${category}" ]; then
            args+=(--category=${category})
          fi
          pnpm run plan:run -- "${args[@]}"

      - name: Save progress after generation failure
        if: ${{ !cancelled() && steps.generation.outcome == 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plans data/transcripts data/transcription-jobs.yml episodes
          if ! git diff --staged --quiet; then
            git commit -m "auto: save incomplete generation progress"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Require successful generation before building
        if: ${{ !cancelled() && steps.generation.outcome == 'failure' }}
        run: |
          echo "::error::Content generation or transcription failed. See the generation summary; deployment stopped."
          exit 1

      - name: Normalize generated metadata
        run: pnpm run normalize:meta -- --fix

      - name: Validate generated artifacts
        run: pnpm run validate:artifacts

      - name: Compute episode build cache key
        id: episode-cache
        run: pnpm run build -- --cache-key

      - name: Restore episode build cache
        uses: actions/cache@v5
        with:
          path: .cache/episode-builds
          key: resonote-episode-builds-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ steps.episode-cache.outputs.key }}
          restore-keys: |
            resonote-episode-builds-v2-${{ runner.os }}-${{ runner.arch }}-node22-
            resonote-episode-builds-v1-${{ runner.os }}-

      - name: Build all
        run: pnpm run build

      - name: Audit independent brand identity
        run: pnpm run audit:brand

      - name: Audit home interactions and responsive layout
        run: pnpm run audit:home

      - name: Verify slide routing
        run: pnpm run verify:routing

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plans data/transcripts data/transcription-jobs.yml episodes
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "auto: generate rss episode"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
