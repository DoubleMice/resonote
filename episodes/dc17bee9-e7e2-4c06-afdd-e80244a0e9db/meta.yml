summary: |
  本期是 Acquired 对华特迪士尼公司的 4 小时 33 分钟史诗级复盘：从 1984 年公司濒临被肢解、Eisner 与 Wells 的文艺复兴，到 ESPN 转播费机器的崛起，再到 2006 年 Iger 收购 Pixar、2009 年买下 Marvel、2012 年买下 Lucasfilm 的飞轮重建；最后是 2015 年剪线风暴、自建 Disney+ 的豪赌，以及 2026 年乐园贡献近六成营业利润、影院发行只占收入 3% 的现状。Ben 与 David 的最终结论：迪士尼是代际神话的家园，你永远杀不死它。
core_ideas:
  - '1984 年濒死时刻的教训：迪士尼值钱的是飞轮而非任一业务，肢解方案摆在桌上时，正是 CalArts 埋下的人才火种救了公司'
  - 'Eisner 与 Wells 的复兴配方：乐园抬价换现金、高概念低成本电影、音乐剧公式、VHS 印钞机——把一个濒死公司十年做成 $220 亿市值'
  - 'ESPN 转播费是史上最强现金机器：$9.42/户/月的定价权让它为 Pixar、Marvel、Lucasfilm 三大收购埋单'
  - 'Pixar 收购的本质是认输与自救：长椅上的癌症秘密、保留 Pixar 文化、把迪士尼动画交给 Lasseter 和 Catmull，换来"我们救了两家公司"'
  - '流媒体的根本矛盾：消防水管与飞轮正交，迪士尼品牌有东西可输，而 Netflix 的品牌只是一个按钮'
  - '2026 年的迪士尼：乐园占约 60% 营业利润、影院发行只占 3% 收入；Ben 的结论——代际神话杀不死，迪士尼会起伏但总会回来'
