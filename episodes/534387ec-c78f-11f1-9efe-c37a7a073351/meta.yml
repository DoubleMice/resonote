title: 为什么 Lorenzo Valente 认为加密项目回购是错误的资本配置
guest: Lorenzo Valente
guest_role: ARK Invest 数字资产研究总监
tags:
  - interview
  - investor
  - strategic
summary: |
  ARK Invest 数字资产研究总监 Lorenzo Valente 认为，加密市场正从发现新协议原语转向检验规模、分发和价值沉淀。他反对早期项目把全部收入用于回购和销毁代币，主张把资本优先投向增长、用户关系、安全、合规和竞争准备。
  访谈还讨论了量子与 AI 风险对托管的影响、以太坊一层与二层的价值分配、代币化证券的分发前景，以及稳定币网络效应。
core_ideas:
  - 投资重心正从发现链上原语转向判断产品能否扩大规模，并进入传统金融和现实世界资产市场。
  - Valente 认为，量子与 AI 带来的不确定性、日常攻击和协议关闭风险，会使交易所、券商和 ETF 的运营安全与监管能力更重要。
  - 以太坊的核心争议在于二层活动增长后，主网能否获得足够费用和价值；Valente 认为其策略需要更清楚。
  - 早期项目把全部收入用于回购和销毁代币，可能放弃了产品、分发、收购和人才投入等更有价值的资本用途。
  - 代币化股票与稳定币都依赖分发、托管、清算和合规；稳定币的流动性与迁移成本构成强网络效应。
