summary: |
  Laura Shin 主持的 Unchained 圆桌对谈，聚焦链上隐私的技术路线之争。Aztec Labs CEO Joe Andrews、Logos 创始人 Jared Hope 和 Helios CEO Mert Mumtaz 从交易成本经济学、密码学货币使命和机构金融需求三个角度，讨论了 Zcash 的 Ironwood 升级、Ethereum 隐私路线图的时机风险、Canton 等中间人隐私方案的局限，以及 AI 驱动形式化验证对 ZK 安全的革命性影响。核心结论：隐私不是零和博弈，而是整个加密行业从"信任"走向"验证"的共识基础设施升级。
core_ideas:
  - '区块链的核心价值不是区块空间，而是"可信承诺"——激励性承诺 vs 命令性承诺，后者只能用密码学和博弈论实现'
  - 'Zcash 填补了 Bitcoin 未完成的隐私使命：Satoshi 本人曾表示 ZK 隐私会让 Bitcoin 更好，但当时没有技术解决双花问题'
  - '隐私本身就是一种扩容技术：机构因为 OPSEC、监管和法律原因，在完全透明的链上无法真正开展业务'
  - '密码学隐私 vs 中间人隐私是两条根本不同的路径；Canton 提供的是"银行级别的保障"，而非密码学承诺'
  - 'AI 让形式化验证规模化——Zcash Ironwood 升级已实现"不可检测的伪造漏洞在数学上不可能"'
  - 'Ethereum 隐私路线图宏大但遥远，隐私之战正在今天打响，等到路线图完成时可能窗口已经关闭'
