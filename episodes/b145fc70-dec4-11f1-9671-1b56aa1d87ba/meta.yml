title: 「超声波货币」叙事失效后：以太坊、钱包与推理市场
guest: Greg Markou
guest_role: 前以太坊核心开发者
tags:
  - panel
  - engineer
  - technical
  - strategic
summary: >
  前以太坊核心开发者 Greg Markou 与 Kain、Austin 讨论了「超声波货币」叙事为何不足以说明 ETH 的价值，以及 gas 改价怎样牵动既有应用的复杂依赖。话题还延伸至 Ledger
  清晰签名的信任边界、把多签隐藏在应用体验后的取舍，以及链上推理市场如何利用订阅与 API 之间的价格差。
core_ideas:
  - EIP-1559 改善了费用体验，但销毁机制不应替代对以太坊网络价值的完整说明
  - gas 重定价要同时考虑协议资源、既有合约和链下服务之间难以穷尽的依赖
  - 清晰签名需要解释复杂交易，服务器协助、设备能力和遥测边界因此成为安全争议
  - passkey、多签、限额与恢复机制可以藏在应用后台，但跨链兼容会把最弱环节带进体验
  - 推理额度的价格差可能形成双边市场，隐私、履约和套利会决定这种市场的边界
