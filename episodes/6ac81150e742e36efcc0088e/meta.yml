summary: |
  Jaggie 从早期电商、对话助手和消费互联网的经历出发，讨论搜索、推荐与多轮聊天如何改变平台获得用户信号的方式，以及广告为什么必须从原生交互中生长出来。访谈还比较了品牌与效果广告的衡量、不同市场的数据条件，并讨论了聊天产品的记忆、成本、隐私和商业化边界。
  他认为，模型能力和数据入口都很重要，但广告产品能否成立仍取决于用户信任、任务体验、组织速度与持续的商业回报。
core_ideas:
  - 搜索、推荐和聊天分别提供查询词、行为信号与多轮上下文，平台对意图的理解因此发生变化。
  - 新广告形态依附于新的原生交互；聊天回答、相关内容页和互动内容都可能成为不同的商业化位置。
  - 购买路径越接近行动越容易衡量，品牌认知与低频决策仍需要抽样、增量评估和跨渠道分析。
  - 中国与美国在交易和数据的集中程度上不同，历史数据积累与隐私规则会影响广告系统的能力。
  - 聊天产品的商业化要同时处理推理成本、用户信任、敏感场景的边界，以及记忆能否转化为可感知的任务优势。
