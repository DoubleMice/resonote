summary: >
  彭新宇把 FDE 放回企业现场来讨论：一个催发货电话可能要穿过 260 多步流程，Agent 能否落地取决于业务目标、企业数据和岗位标杆是否被连起来。对话还拆解了数字员工的一周上岗流程、FDE
  的组织分工、坐席费与效果费，以及企业如何在模型能力、数据治理和业务结果之间算清楚账。
core_ideas:
  - FDE 的价值来自 AI 锐度、行业深度和数据宽度的叠加，职位名称本身不会带来溢价。
  - 企业级 Agent 要先选择耗人、耗钱或耗时且结果可度量的场景，再把系统、数据和权限接通。
  - 数字员工的实施包含岗位学习、建模、执行和迭代，Agent 交付后还要持续评测和调教。
  - 中国式 FDE 往往要从数据地基开始，企业内部的 BA、AI 架构师和岗位专家需要组成协作组织。
  - 企业可以按坐席或按效果付费，但最终都要用业务结果验证投入是否值得。
