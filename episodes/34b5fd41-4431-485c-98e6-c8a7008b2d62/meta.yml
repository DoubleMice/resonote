title: E260｜黄仁勋归来之际，深聊英伟达、CoreWeave和算力信用市场
guest: Maggie Wang、徐一星
guest_role: 安先资本创始人兼CEO、数据中心规划与能源策略从业者
tags:
  - hardware
  - chips
