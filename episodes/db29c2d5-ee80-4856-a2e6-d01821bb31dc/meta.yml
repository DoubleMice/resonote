summary: |
  TBPN 这期围绕 AI 开源 vs 闭源的辩论展开，Nvidia CEO Jensen Huang 发起 Open Secure AI Alliance，35+ 家公司签署公开信支持开源模型，合计市值超 18 万亿美元。节目深入讨论了蒸馏争议、网络安全的军备竞赛逻辑、中国开源模型的崛起等话题。多位重磅嘉宾出场：Gary Vaynerchuk 分享了他对社交媒体和收藏品投资的前瞻判断，Sequoia 的 Dean Meyer 剖析了"美国开放模型悖论"，Nvidia VP Justin Boitano 阐述了开源防御的不对称优势理论，此外还有 RoboStat、Death Clock、Andromeda 三家初创公司的介绍。
core_ideas:
  - 'Open Secure AI Alliance：Jensen Huang 发起，35+ 家公司签署，$18万亿市值背书，主张开源模型是防御资产而非风险'
  - 蒸馏争议的真实程度：Dean Meyer 认为真相在中间——蒸馏确实发生，但说不清贡献了 20%、30% 还是 40%，重要的是结构性不对称确实存在
  - Hugging Face 事件成为开源论证的核心案例：闭源模型拒绝做网络防御分析，开源中国模型拯救了平台
  - 'Gary Vaynerchuk: 对消费者行为的观察能力——不让自己想达成的结果污染对未来趋势的判断——是他持续押中未来的核心'
  - Justin Boitano 的"组合使用"范式：前沿模型负责复杂规划，开源模型负责成本敏感的常规任务，两者互补而非取代
  - Dean Meyer 的"NP-Hard 后门问题"：AI 安全状态类似 2001 年被破解的 Wi-Fi 加密——问题已知但尚未触发应对
