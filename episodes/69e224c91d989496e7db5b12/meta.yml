summary: |
  庄明浩与进击波财经讨论了视频模型、Agent、模型公司估值和 AI 硬件的近期变化。节目把 Agent 的热度放进任务交付系统、企业软件预算和生态入口中理解，也保留了高估值、基础设施与硬件周期带来的不确定性。
core_ideas:
  - 视频模型的竞争已不只是能力比拼，也取决于资金、算力成本与持续投入的耐力。
  - Agent 要完成任务，需要模型之外的上下文、工具、权限和反馈机制。
  - 节目所述模型公司估值主要由相对参照、标的稀缺和收入预期推动，后续仍要看财务数据与解禁窗口。
  - AI 编程和企业 Agent 可能改变既有软件预算，但这条路径的规模与替代程度尚待验证。
  - 硬件产品按年迭代，与模型按月变化的节奏错位；短期内更多是在增强手机和现有生态。
