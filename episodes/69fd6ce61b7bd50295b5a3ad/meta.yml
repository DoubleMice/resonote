  - hardware
  - strategic
  - interview
summary: |
  一场从 Manus 收购争议出发的串台对谈，讨论中美 AI 竞争如何改变跨境融资、公司身份与监管判断。话题随后转向 Agent 的运行机制、生成式 AI 对软件和创作成本的压缩，以及白领就业、数据中心和个人选择面临的现实约束。
  对谈没有把这些变化归结为单一技术或单一政策，而是保留了交易细节、就业因果和制度边界仍不明确的部分。
core_ideas:
  - Manus 事件在节目中被视为商业退出与国家竞争框架相撞的案例，收购和恢复交易的细节仍不清楚。
  - Harness 为模型补上任务定义、权限、记忆和评测，使 Agent 能在工具与环境中持续工作。
  - AI 降低软件、视频和短剧等执行成本后，目标、约束、验收和分发的价值更突出。
  - 节目把白领就业压力放进更长的技术转型周期，同时承认裁员和收入变化不能只归因于 AI。
  - 存储、通信、CPU、电力与审批决定数据中心扩容速度，也让 AI 发展成为公共资源问题。
