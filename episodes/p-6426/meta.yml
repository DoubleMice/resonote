summary: |
  游戏设计师 Jeff Kaplan 回顾从写作受挫、《无尽的任务》公会到加入暴雪的经历，解释《魔兽世界》的任务系统和《守望先锋》的开发过程。他也谈到 Titan 项目失败、游戏开发中的加班与商业压力，以及新工作室和 AI 工具的选择。
core_ideas:
  - 《魔兽世界》通过连续任务和经验奖励引导玩家探索，同时保留单人游玩的空间。
  - 设计师设想的社交体验未必符合玩家需要，荆棘谷书页任务的背包问题就是教训。
  - Titan 在核心方向和工具尚未稳定时扩大团队；《守望先锋》则从更受约束的目标和现有人才出发。
  - Kaplan 既珍惜早期团队的投入，也反对强制加班，并回顾续作与电竞业务对开发资源的压力。
  - 新作以虚构的加州淘金时代为背景；他支持 AI 处理部分重复工作，同时强调许可和创作者的判断。
