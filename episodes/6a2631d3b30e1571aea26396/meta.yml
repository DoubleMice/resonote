summary: |
  方士心从高考的筛选机制谈到 AI 对教育的压力：考试仍关系到现实机会，但父母不能把培养孩子等同于筛选孩子。她认为，兴趣、无结构时间、元认知和真实经验，是孩子在变化中学习、提问并使用工具的基础。
  节目也回到亲子关系。设定边界不等于把每次分歧变成服从测试；家长的示范、无功利陪伴和协商，能让孩子在挫折中保有重新开始的空间。
core_ideas:
  - 兴趣能带来内驱、专注和自控，家长应在学校要求之外保护这种动力。
  - 元认知让人知道自己和 AI 各自懂什么、不懂什么，因而能提出更具体的问题。
  - 高考的大规模、标准化与高利害关系，使它承担筛选功能，也让改革需要面对公众的公平期待。
  - AI 可能扩大资源与能力差距，也给单次升学不顺的人带来学习和创造的新入口。
  - 亲子关系是教育的底线；示范、拥抱、陪伴与协商比控制更能支持孩子面对风险和挫折。
