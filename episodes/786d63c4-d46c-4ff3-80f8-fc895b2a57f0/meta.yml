summary: >
  Mark 与子阳从大模型 decode 阶段的带宽瓶颈出发，比较 Groq 的静态调度、Cerebras 的晶圆级设计，以及 OpenAI Teren
  偏向通用性和能效的取舍。讨论也把芯片指标放回系统成本、模型变化、软件栈和供应链中，并通过 Bill Dally 的局部性原则说明架构设计如何寻找真正的限制。
core_ideas:
  - 云端推理的核心结果是每个 token 的成本与单用户生成速度，纸面算力和带宽需要放在系统中衡量。
  - SRAM 把存储移近计算单元，带来高带宽，却要求用大量芯片和高速互联解决模型容量。
  - Groq、Cerebras 与 OpenAI 的路线分别把取舍放在静态调度、晶圆级制造和芯片内异构的能效上。
  - Bill Dally 强调局部性和系统级取舍；创业还必须完成供电、散热、封装与量产等工程工作。
