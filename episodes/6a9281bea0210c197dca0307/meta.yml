summary: |
  明浩从 Figma、Canva 的市场重估谈起，拆解多模态 AI 应用为什么会被担心遭模型吞噬：单点功能容易同质化，成本、留存和利润却未必同步改善。
  他以美图为样本，讨论成熟产品如何与自研模型、场景化工作流和新产品孵化结合；真正值得观察的是应用能否持续交付用户愿意反复购买的结果。
core_ideas:
  - 模型容易覆盖标准化的单点功能，但难以自动完成复杂场景中的结果交付。
  - AI 应用需要把模型选择、任务拆解、质量控制和最终交付组织成一条流程。
  - Figma 与 Canva 的案例显示，收入增长不必然消除市场对 AI 重估软件价值的担忧。
  - 美图的成熟影像业务、新产品矩阵和自研模型，提供了观察第二曲线的一种样本。
  - 判断 AI 应用不能只看下载和 MAU，还要看留存、续费、单位经济与长期现金流。
