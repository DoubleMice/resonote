title: Kalshi 的社交媒体争执，为何让其 ETH 永续合约成交量受到审视｜Uneasy Money
guest: Kain Warwick、Taylor Monahan、Austin Griffith
guest_role: Uneasy Money 主持与联席主持人
tags:
