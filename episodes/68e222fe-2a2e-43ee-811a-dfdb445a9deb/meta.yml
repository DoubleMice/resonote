summary: |
  宇树上市之后，中国具身智能创业热潮到了一个高峰。晚点记者子南与玉萌（报道
  《具身智能的金钱游戏》的两位作者）和主播一起复盘这场由金钱主导的竞速：行业
  表象是融资远超研发投入，根源是技术仍处早期、进展难以观测，估值容易在高估与
  低估之间摇摆。他们拆解了收入"做大术"——地方数据采集中心、科研教育与制造业
  场景三大收入来源，以及机器人公司与供应链企业互为供应商加客户的生态；也讨论
  了港股 18C 门槛下的 IPO 竞速、一级市场攒局式的融资结构与二级市场开始追问的
  可验证指标。节目最后指向未来最重要的验证：1000 万小时数据能否证明模型
  scaling，以及宇树上市后的定价会落在哪里。
core_ideas:
  - 剪刀差：头部公司融资超 50 亿、研发约 3000 万/年，最差理财的利息都够覆盖研发；症结是缺乏"往哪个方向押注"的技术判断
  - 进展难测：没有公认 benchmark，具身复现难、观测难；全行业千卡集群公司仅八家，还没有公司用十万小时以上数据跑过一次模型
  - 收入催熟三来源：地方数据采集中心（去年全行业最大客户）、科研教育与迎宾导览、制造业场景；四个数采中心就能凑够 18C 的 2.5 亿港币收入门槛
  - 生态循环：零部件公司既是供应商、客户，也是投资人、销售代理；长盛轴承 800 万元订单撬动约 5 倍股价涨幅
  - IPO 竞速：除宇树外确定有投行在工作的公司已 14 家，牛市窗口已 20 多个月；马斯克 10 万台指引对 8 月 300 台产量，智元邓泰华的 1.6 万台指引被视作更靠谱
  - 攒局式融资：攒局人 + T0 产投 6~8 家 + T0 VC 10~15 家，每轮 3+3 上牌桌为后续融资背书；高瓴与红杉在具身项目同轮出现
  - 二级拷问与未来验证：泡沫四步曲的第五步没人给出答案；1000 万小时数据将验证 scaling，宇树上市 6 个月的价格是行业定价风向标
