core_ideas:
  - 蒸馏的门槛：用教师模型的问答对训练学生模型，需要算力、数据和提问技巧，不是简单抄答案
  - 被蒸馏的对象在进化：从题目答案，到 o1/R1 之后的推理过程，再到智能体在环境中完成任务的完整轨迹
