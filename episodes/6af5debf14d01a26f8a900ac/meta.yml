summary: |
  梁其伟回顾从《雨血》到《影之刃零》的创作与创业历程，解释他如何以风险、边缘性与极端人物理解武侠，并将其转化为面向当代玩家的功夫朋克表达。
  访谈也梳理了灵游坊在手游时期获得的商业和团队经验，以及团队为何最终把资源、发行和商业动作重新放回服务单机创作的位置。
core_ideas:
  - 侠在梁其伟的创作理解中，必须在真实风险下仍按自己的判断行动
  - 当代武侠人物可以先追求自我完整，行动的结果仍可能帮助他人
  - 手游阶段带来项目管理和商业经验，也暴露了追逐风口与创作目标错位的代价
  - 《影之刃零》选择完整周期的单机表达，因为它更适合团队的创作节奏
  - 游戏的作者性来自长期的选择和承担，AI 可以辅助生产但不会自动形成玩家信任
