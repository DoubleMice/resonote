summary: |
  出生于2009年、现今17岁的高二学生苏庭浩，高中阶段独立做预训练研究，一篇关于attention机制的论文被ICML 2026 main track接收。
  他从对ChatGPT的"暗笑"起步，走完吴恩达课程、Karpathy视频、30天读论文挑战和半年200+次实验的预训练实践，
  也在ICML会场逢人就问"AI会不会导致人类灭绝"（30多人里13.5个觉得会），并因此低落过几周。
  从烧钱3万块和1500块的眼泪，到湖山支教的"两个世界"，再到"情绪就是强化学习"的开心哲学，
  这期节目是一个AI原住民少年对技术、教育与人生意义的完整自白。
