summary: |
  本期「晚点聊」AI 季报迎来 26 年第二季度。Anthropic 的 Fable 5 被 Henry 评价为"史诗级能力、灾难级发布"，OpenAI 的 GPT-5.6 用 TerminalBench 首次破 90 反攻；coding 市场经历从 Claude Code 到 Codex 的迁移潮与价格战，Anthropic 却在 Q2 实现首次盈利。本季最重要的叙事是 RSI（递归自进化）——Anthropic 发文《One AI Builds Itself》，Recursive、Merindale、Core Automation 等新公司批量涌现；中国开源模型八周内四次易主，Harvey 用 GLM 5.1 后训练出自己的模型；机器人与世界模型赛道 18 个月吸金超百亿美元，OpenAI 与 Anthropic 同步官宣机器人团队。Henry 从"推进前沿智能"与"加速智能扩散"两条线梳理全局，并讨论了预训练窗口、企业自有模型与 AI 研究的科学化。
core_ideas:
  - Fable 5 能力史诗级但发布灾难级——过度封锁加静默降智，Henry 称之为"定义级别的错误"
  - 收入竞赛 Anthropic 越跑越快——年化营收预期从 5 月初的 470 亿美元涨到 6 月中的 620 亿，Q2 首次盈利约 5.6 亿美元
  - RSI 成为本季主线——Anthropic 称代码库里超 80% 代码由 Claude 所写，Recursive 用同一套系统拿下三个 SOTA
  - 中国开源模型"四杀"——八周内四次易主，GLM 5.2 支持 Anthropic API，可"几乎无痛"替换 Opus 4.8
  - 企业开始拥有自己的模型——Harvey 用 GLM 5.1 后训练，在自己的 benchmark 上击败 OpenAI 与 Anthropic
  - 预训练窗口已经关闭——Henry 认为新玩家的机会"已经结束了"，但前沿不会是一家公司持续领先
