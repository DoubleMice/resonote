summary: >
  这期 Solo 讨论 V4 发布前的 DeepSeek：近期少量研发人员流动，如何与 AI 人才竞争、期权定价和 V4 的等待交织在一起。节目也拆解梁文锋对 AGI
  的理解——除了提高模型智能上限，还要建设国产生态、投入回报不确定的原创方向；与此同时，产品触点、Agent 竞争和算力约束正在重新定义这家公司的压力。
core_ideas:
  - DeepSeek 的少加班、扁平组织和跨组协作，构成了更像实验室的研究环境。
  - 上市公司的财富效应放大了 DeepSeek 期权缺少明确估值的问题，也改变了人才比较机会的方式。
  - 梁文锋把 AGI 目标拆成智能上限、国产生态和原创探索三条工作线。
  - Agent 应用竞争让模型评价从 benchmark 排名扩展到产品触点、真实体验和长尾数据。
  - 小团队和较少工作时长曾支撑 DeepSeek 进入全球大模型第一梯队，但算力与人才竞争正在改变约束条件。
