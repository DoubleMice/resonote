summary: >
  TBPN 的万圣节特别节目借巴菲特与芒格的扮装，讨论市场大跌、数字资产安全事件和收藏品流通的摩擦。Will Manidis 提出 AI 训练成本、主权模型与美元支付体系可能相互强化的推演；David Senra
  则从巴菲特与芒格的长期合作谈到信任如何在数十年的共事中形成。
core_ideas:
  - 当天的市场波动让 AI 转型的盈利压力与 Alphabet 的多层资源优势同时进入讨论。
  - 收藏品的成交价值取决于真伪、保存、保险和运输，而不只是物件稀缺。
  - Will Manidis 的主权模型与新美元推演建立在持续扩展和高资本开支的假设上，也包含安全与地区冲击的风险。
  - DoorDash 的代理订单仍只有数百笔，说明模型能力、授权习惯和合适的工作流要同时具备。
  - Senra 认为巴菲特与芒格的伙伴关系来自长期共事所积累的信任与彼此理解。
