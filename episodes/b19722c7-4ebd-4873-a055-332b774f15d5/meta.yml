summary: >
  Henry Yin 从 OpenClaw 的个人助理形态出发，分析 Claude Code、Codex 与模型厂商如何把竞争推进到产品、生态和企业部署层面。节目也讨论了 Auto Research
  所代表的自进化实验、持续学习的技术边界，以及 Agent 对推理基础设施、组织配置和劳动市场的影响。
core_ideas:
  - OpenClaw 的关键在于将本地权限、聊天入口、记忆与工具执行组合为个人助理体验。
  - 编码能力正成为通用 Agent 的执行底座，模型厂商因此更重视开发者产品与真实使用数据。
  - Auto Research 已能在明确指标下自动尝试训练代码改动，但目标与搜索空间仍由人主导。
  - 持续学习在记忆文本和部分权重更新之间探索，规模、成本与基础设施仍是难题。
  - Agent 的扩张把竞争带到推理成本、CPU 资源、组织效率与劳动市场。
