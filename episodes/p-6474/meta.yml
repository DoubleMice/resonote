summary: >
  Gary Gallagher 解释了奴隶制扩张、1860 年选举和州权冲突如何把两个共和国推向战争，也区分了战争起因与普通士兵的参战动机。对谈随后追踪 Lincoln、Grant、Lee 与 McClellan 的选择，梳理
  Vicksburg、Gettysburg、Atlanta 和 Appomattox 的不同作用，并说明国家重新合并与真正和解之间仍有很长距离。
core_ideas:
  - 奴隶制是内战的结构性起因，但多数白人士兵首先以捍卫联邦为参战理由
  - 邦联拥有守土和低胜利门槛等条件，美国则在战争中逐渐形成更完整的高级指挥梯队
  - Lee 的进攻性既是邦联争取胜利的机会，也加快了南方的人力消耗
  - Grant 以持续作战削弱 Lee 的军队，Atlanta 的失守又把军事结果转化为民众支持与政治授权
  - Appomattox 促成国家重新合并，却没有立即带来平等权利与社会和解
