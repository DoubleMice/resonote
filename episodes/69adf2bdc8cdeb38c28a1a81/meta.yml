summary: >
  明浩以 2026 年 2 月的行业事件为窗口，分别梳理美国的算力投入、英伟达、Agent、软件股和 OpenAI
  融资，以及中国的模型发布、视频生成、春节获客和模型公司估值。节目把市场情绪、公司披露和条件性推演放在一起讨论，也保留了算力供需、留存、监管与就业影响等尚无定论的问题。
core_ideas:
  - 四家美国科技公司 2026 年 Capex 预期继续增长，但供给何时超过 AI 需求没有明确阈值。
  - 本地权限和即时通信让 Agent 的协作感更强，同时暴露算力、部署与可靠性约束。
  - 软件股下跌引出 AI 替代、就业、消费和债务风险的推演；这条链尚未成为已发生的事实。
  - 中国模型在春节前后密集更新，视频生成能力提升同时把版权、隐私与伪造风险推到台前。
  - 春节红包活动制造短期使用峰值，但主持人认为 Chatbot 的高频留存仍受产品形态限制。
