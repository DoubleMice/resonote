summary: |
  郑迅从快手的内容消费和广告实践出发，复盘了 2025 年短剧、漫剧与小游戏的变化。节目讨论 AI 如何降低漫剧制作的一部分门槛、改善广告推荐与出价，也保留了内容回收、模型可靠性和新形态尚未落地等限制。
core_ideas:
  - 短剧进入深水区：长尾内容更快失去关注，制作成本和 IAA 模式下的回收压力同时上升。
  - 漫剧在 2025 年第三、四季度的增长主要来自供给增加；分环节的人机工作流使小团队可以参与制作。
  - 短剧的 IAA 降低了用户继续观看的门槛，但版权方更依赖广告收入，回收周期也更长。
  - 小游戏仍以 IAP 与 IAA 混合变现；AI 目前更多改善组件和生产环节，尚未明显降低复杂游戏的成本。
  - 大模型可用于内容理解、重复物料归并、语义编码和广告出价，但需要奖励机制、人工反馈与可回查的策略流程。
