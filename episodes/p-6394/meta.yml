summary: >
  Sebastian Raschka 与 Nathan Lambert
  讨论开放模型、中美竞争及语言模型的训练方法，解释可验证奖励、推理计算和工具调用的作用与局限。两人也谈到编程与学习、硬件成本、机器人安全，以及自动化研究和通用人工智能预测中的不确定性。
core_ideas:
  - 开放权重便于部署和改造，但不等于公开训练数据、代码与完整过程。
  - 预训练、后训练和推理计算都可能改善模型，选择取决于效果、用户规模与成本。
  - 可验证奖励强化学习能改善解题表现，数据污染使能力来源更难判断。
  - 智能体依赖工具权限、可靠接口与上下文管理，离稳定完成任意工作仍有距离。
  - 自动化既能减少琐事，也可能影响学习、工作乐趣和人的自主感。
