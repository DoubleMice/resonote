summary: |
  明浩以 36 氪资情留言板第 1 至第 183 期的 5,032 条交易线索为样本，讨论未上市老股如何在一级与二级市场之间流转。节目从整体转让与求购比例、年度变化、行业迁移和热门标的的供需差异，观察中国一级半市场中的退出压力与买方偏好。
core_ideas:
  - 一级半市场承接的是未上市股权的存量转让，员工、创始人和临近到期的基金都可能在这里寻找流动性。
  - 样本中转让线索占 63%，求购占 29%，但 2026 年截至节目统计时，求购占比已升至 56.6%。
  - 字节跳动在五年样本中出现 562 次；小红书、Animoca 等公司则呈现不同的供需结构。
  - 主持人用 Agent 收集和清洗异构材料，但保留了问题定义、阶段审核和结果验收等研究判断。
