summary: |
  韩峰涛从上一轮工业机器人创业的市场教训出发，解释千寻为何把数据与具身基模放在短期营收之前。他认为 2026 年的关键是扩大真实数据采集、提高模型基本能力，并用少量现场项目寻找可复制的落地路径。
core_ideas:
  - 工业机器人完成国产替代后，仍受限于市场规模和任务覆盖面；具身模型被寄望于扩大机器人能做的工作。
  - 千寻选择视频、可穿戴设备、遥操作和强化学习结合的真实数据路线，并把数据生产速度视为竞争指标。
  - 宁德时代的插拔检测被用来验证模型、本体和场景的配合，同时获得真实产线的反馈数据。
  - 韩峰涛认为 2026 年先比数据和模型性能；具身机器人的大规模落地要等基本能力进一步成熟。
  - 第一次创业的磨刀工作站证明，技术做得很强并不等于市场足够大；早期场景还需要能规模化复制。
