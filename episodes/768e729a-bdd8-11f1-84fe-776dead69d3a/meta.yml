summary: >
  Bitget 3.88 亿美元失窃事件的初步信息显示，攻击者可能绕过提现流程中的控制，而非直接拿到私钥；Pablo Subtella 将入口指向第三方安全产品的零日漏洞。面板还讨论了冻结赃款的治理边界、AI 代理的安全与监管叙事、前沿
  AI 的融资和价格，以及以太坊 2030 路线中的工程与商业约束。
core_ideas:
  - 面板认为 Bitget 攻击涉及部分系统访问与提现伪造；完整取证路径在录制时尚未公开。
  - Pablo Subtella 认为，第三方供应商的运维安全也是机构安全边界的一部分；更多系统复杂度会同时增加防线和攻击面。
  - 冻结盗款需要在反应速度与权力边界之间取舍；固定金额门槛也可能反过来给攻击者提供规避目标。
  - 关于 AI，嘉宾既担心具备行动能力的代理，也质疑风险叙事、开源扩散和监管激励会如何相互作用。
  - 面板把以太坊 2030 的难点分为正确实现、组织协调和商业需求，并未把 AI 加速等同于可以跳过验证。
