summary: >
  梁琛奇回顾自己从抖音社交、实时社交到猫箱的产品经历，解释了为何他认为 AI
  娱乐需要等到推理成本、模态和用户习惯同时变化后才有机会起步。创业后的动念引线先用松果时刻观察普通人的表达，再以快速试验、专用模型和内容关系网络寻找实时互动内容的产品形态。

  他预计新体验的雏形可能在一到两年内出现，但也把它会否如期出现视为公司最大的风险。
core_ideas:
  - 娱乐产品的长时使用会放大推理成本；成本、模态和用户习惯共同决定启动窗口。
  - 猫箱将 AI 角色聊天设计为有多角色和剧情推进的互动内容，保留人类创作者对世界与角色的设定。
  - 松果时刻用照片和叙事生成漫画，帮助团队观察生活记录、情绪、同人幻想和站外创作等表达用法。
  - 动念引线用一两人快速测试多个想法，并通过持续复盘修正产品和组织上的误判。
  - 梁琛奇把应用模型、内容生态与可交叉的上下文视为 AI 娱乐的潜在壁垒。
  - 新体验能否在一到两年内出现仍未确定；产品需要同时具备新颖、高频、长期和可扩展性。
