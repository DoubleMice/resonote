summary: >
  OceanBase CTO 日昭与两位数据库比赛参赛学生讨论了一个企业 AI 的具体难题：模型如何使用私有数据，并让检索结果可以回到原始资料。节目从混合检索、AI 编程和数据库人才培养谈到持续学习与
  Agent，反复强调模型能力进入业务流程还需要数据、权限和人工审查共同配合。
core_ideas:
  - 企业私有数据通常不在通用模型的预训练中；如何管理、检索并接入业务流程，仍是企业 AI 的早期工程问题。
  - 混合检索把向量、全文等方法放在一起使用；答案正确还不够，文档与页码的来源也要稳定。
  - AI 编程可加快阅读代码和生成实现，但严谨代码仍需要人理解需求、审查结果并组织测试。
  - 日昭把持续学习分为模型内部更新和数据库加上下文两条路径，并认为前者的自动化效果仍难预测。
  - 嘉宾预计通用 Agent 会继续快速发展，而企业 Agent 的节奏受私有数据、权限和业务系统接入约束。
