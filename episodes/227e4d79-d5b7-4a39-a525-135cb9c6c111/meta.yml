summary: |
  晚点主笔高洪浩与主持人曼琪复盘他 7 月 13 日发布的长文《当一个年轻人空降改造腾讯混元的 300 天》：29 岁的姚顺雨如何以 The Second Half 的判断选择腾讯、在 Martin 的信任下两三个月换掉预训练、后训练、评测与 Infra 全部关键岗位，再用一个接近 300B 的"小模型"混元 3 完成预期管理与团队磨合。播客补充了文章没展开的议题：混元与微信 VLM 两套大模型为何大概率长期并存，张小龙对隐私与可控的执念，腾讯联邦制组织与字节式"拧成一股绳"之间的张力，以及从 coding 到通用 agent 的扩散节奏决定 AI 商业化下一轮拐点何时到来。
core_ideas:
  - '姚顺雨选腾讯的理由写在博客《The Second Half》里：下半场比拼的不是训练技巧，而是定义真正值得解决的问题——而找问题依赖大公司沉淀的 context，腾讯和 Meta 拥有最多场景'
  - '混元的出身是一场内部赛马：TEG 里多个团队各自做模型，数据平台部胜出成为混元 1/2 底座；起步只有 2000 张卡，还是从广告部门匀来的'
  - '姚顺雨在老板最信任的阶段迅速换掉了预训练、后训练、评测、Infra 的关键岗位，从 Seed Infra 挖人；对旧团队的口径是"你只要不碰基模，你爱干嘛干嘛"'
  - '混元 3 是一次精心设计的预期管理：先发 preview 再发正式版，接近 300B 的 MoE 小模型定位是"让组织磨合好、士气重振"，总办的评价是"符合预期"'
  - '混元与微信 VLM 大概率长期并存：张小龙不觉得混元是第三方，但对隐私和用户数据极度在意，更倾向自己做一个更可控的模型'
  - '腾讯的组织惯性是联邦制：中枢有掌控力但不强制统一；内部用《黑鹰坠落》的例子讨论面对字节式集权时，跨部门协作的局限与"拧成一股绳"的必要'
