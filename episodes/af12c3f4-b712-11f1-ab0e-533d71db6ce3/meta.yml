summary: >
  Ilya Polosukhin 与 Murt Mumtaz 讨论 Zcash 和 NEAR
  在市场上涨中的角色：前者被视为兼具隐私、储值和抗量子叙事的资产，后者试图用跨链结算让私密资产可以实际使用。对谈同时梳理了极端匿名与可编程保密计算的架构差异，以及伪币漏洞、可升级合约和多方计算网络带来的安全取舍。
core_ideas:
  - 市场普涨之外，两位嘉宾把 Zcash 与 NEAR 的相对强势联系到私密资产的可用性和跨链流动性。
  - Zcash 的用户生成零知识证明强调高度匿名；NEAR 的保密计算允许私密共享状态，却引入更多系统组件。
  - NEAR Intents 以用户意图、求解者报价和跨链结算构成兑换路径；持续使用保密余额会承担 MPC 与合约升级风险。
  - Zcash 的潜在伪币漏洞说明匿名池难以监测供应量；嘉宾称迁移与形式化验证已处理该问题，但节目未提供独立审计材料。
  - Mumtaz 所述的区块时间缩短、Project Tachyon 和私密投票仍有不同时间表，不能视为已完成的功能。
