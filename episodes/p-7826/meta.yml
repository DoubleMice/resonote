summary: |
  Larry Lawton 从《侠盗猎车手 6》谈起，回忆自己在南佛罗里达的珠宝劫案、与犯罪集团的关系，以及被捕后漫长的监禁。出狱后，他向青少年讲述犯罪与监禁的后果，并提出监狱监督和社区警务的建议。
core_ideas:
  - Lawton 认为，现实犯罪涉及事前观察、有限的信任和销赃渠道；他对游戏场景的评价来自个人经历。
  - 他回忆第一次珠宝劫案是珠宝商参与安排的保险骗局，之后继续作案，直至被捕并错过孩子成长的多年。
  - 他描述隔离监禁中的不确定感、据称遭受的虐待，以及阅读、法律申诉和一名狱警的关心如何帮助他坚持。
  - 他建议由熟悉监狱运作的不同人员组成团队，未经预告入内检查，并跟进囚犯是否受到报复。
  - 他出狱后创办 Reality Check 项目，向年轻人讲述亲身经历；节目未交代项目效果调查的完整方法。
