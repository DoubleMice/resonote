title: Home Depot：仓储店、专业服务与规模效应
guest: Ben Gilbert、David Rosenthal
guest_role: Acquired 主持人
tags:
  - deep-dive
  - strategic
summary: >
  Acquired 回顾 Home Depot 如何把仓储式低价、广泛选品和门店专业服务组合成家居建材零售模式，并解释早期的供应商账期为何决定了它先服务现金支付的顾客。节目也梳理了 Nardelli 时代的运营整顿如何伤及门店文化，以及
  Frank Blake 如何以单店生产率、配送网络和面向专业客户的渠道让公司恢复增长。
core_ideas:
  - 早期仓储店依靠直接采购、约 30% 的低毛利率和大量 SKU 吸引客流；库存快速周转才能支付供应商货款。
  - 门店招募有技工背景的员工，既教消费者完成项目，也让服务质量与员工持股形成相互关联的经营机制。
  - Nardelli 集中采购和系统建设带来效率，但削减一线专业员工、改造晋升路径后，同店销售和顾客满意度承受压力。
  - Blake 停止以开店拉动增长，转而提高存量门店生产率，并把电商、配送中心和门店库存连接成即时履约网络。
  - 专业客户、专用配送和美国老化住房存量，是节目用来解释 Home Depot 当前规模与边界的主要条件。
