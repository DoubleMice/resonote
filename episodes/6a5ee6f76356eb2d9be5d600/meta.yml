summary: |
  庄明浩从 Agent 的长时、多智能体运行谈到 AI 基础设施和资本市场的压力：市场已经从模型公司的增长，追问到企业部署能否产生实际收益。对话也回到技术快速替代专业工作时的个人处境，讨论手艺、表达、职业选择与“恩格斯暂停”式过渡。
core_ideas:
  - Agent 的并发协作与长时执行，让 token、算力和供应链的需求加速增长。
  - 资本市场的重点正从模型收入，转向 AI 任务落地后的 ROI 与更广泛的产出。
  - 自主循环与世界模型是研发主线，但它们分别需要复杂的工程环境和不同层级的能力。
  - 手机屏幕已被成熟应用占满，新交互设备仍要在听觉、记录等边缘场景中试错。
  - 技术进步与个人回报可能长期错位，职业之外的表达、兴趣和关系仍需被认真安排。
