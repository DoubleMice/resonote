summary: |
  本期 TVPN 是一次横跨地缘政治、AI 监管、硬件创业和平台经济的多维度对谈。美国以供应链安全为由禁止中国人形机器人进口（中国占全球 85% 份额），Mark Zuckerberg 在 WSJ 发表公开信呼吁加速 AI 发展而非限制，Joe Weisenthal 深度分析 AI 行业从垄断焦虑到资本支出悖论的结构性困境；同时，Chip 的 $15,000 低速电动车、DoorDash Air 获 FAA Part 135 认证的无人机配送、Replit 的 AI 设计和 Weave 的提示词路由器，展示了硬件和平台层面的创新浪潮。
core_ideas:
  - 美国机器人禁令针对一项极早期的技术，尚未形成既得利益集团——这与对中国 LLM 禁令引发的强烈反对形成对比
  - AI 行业的结构性焦虑：全行业在'祈祷寡头而非垄断'，但投资者看不到资本支出竞赛的尽头
  - Joe Weisenthal 的核心洞察：公开信签署顺序精确反映了各公司的商业利益——落后者和供应商先签，前沿领导者最后签
  - Replit 进入'后提示词时代'——从写代码到写 prompt 再到指定意图，AI 工具正在消除表达能力的门槛
  - DoorDash 和 Chip 展示了 AI 如何加速物理世界的创新——从经典启发式方法到 AI/ML 方法的转折点正在发生
  - 关于 AI 能力的两种叙事并存：'这是最笨的版本' vs '模型越来越不通用'
