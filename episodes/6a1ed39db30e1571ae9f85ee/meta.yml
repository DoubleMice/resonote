summary: |
  庄明浩从移动互联网与一级市场的经历出发，解释为什么 AI 时代的投资试错更快，也为何应用公司的护城河需要不断重估。对谈进一步讨论生成式内容的版权与审核、模型竞争、企业采用，以及人在就业、创作和人机竞赛中如何重新理解公平。
core_ideas:
  - VC 的底层判断仍看需求和团队，但 AI 缩短了试错周期，改变的是战术与节奏。
  - AI 已参与知识工作的收集、整理和统筹；最终制作的人工边界取决于任务要求与使用者选择。
  - 垂直应用的数据、工作流和合规要求能形成阶段性保护，但模型公司会进入已被验证的市场。
  - 模型竞争不仅取决于能力评测，也牵涉资源投入、对齐标准和不同使用者感受到的回答风格。
  - 人机公平需要人为设置规则；就业、协作和创作的下一种平衡仍没有确定时间表。
