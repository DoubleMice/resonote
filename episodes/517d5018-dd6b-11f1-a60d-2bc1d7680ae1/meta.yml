title: 蓝潮会阻断加密牛市吗？Bitwise 首席投资官 Matt Hougan 的判断
guest: Matt Hougan
guest_role: Bitwise 首席投资官
tags:
  - interview
  - investor
  - quick-take
  - strategic
summary: >
  Bitwise 首席投资官 Matt Hougan 认为，加密市场在 6 月见底，民主党控制美国国会带来的主要是短期政策不确定性；稳定币、代币化与机构采用才是他所看重的长期变量。他也说明了比特币在 2036 年达到 160
  万美元的假设，并讨论量子风险、代币化股票、Zcash、DAT 与代币回购的分化。
core_ideas:
  - Hougan 将近期市场对黑客事件、通胀和选举结果的承受力，视为早期牛市的迹象；急剧衰退且没有政府回应是他的主要反例。
  - 他认为蓝潮是否伤害市场，取决于国会采取伦理调查还是更具对抗性的监管路线；DeFi 面临的政策风险更集中。
  - 机构采用从家族办公室和独立注册投资顾问扩展到大型财富管理平台，但他用 Bitwise 客户约八次会面后才配置的经验说明，这一过程很慢。
  - 他把量子和 AI 对密码学的威胁看作迁移问题，而比特币早期币的处置可能引发更棘手的社区协调。
  - 比特币 2036 年达到 160 万美元的预测，依赖价值储藏市场扩大到约 90 万亿美元，以及比特币份额从约 5% 升至 25% 两项前提。
  - Hougan 认为 Zcash 的波动与监管不确定性更高；DAT 更接近比特币动量的杠杆版本，代币回购则比单纯减发更受投资者欢迎。
