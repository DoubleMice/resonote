summary: >
  张璐从 TeraFab 的 1 太瓦级算力设想出发，分析了太空数据中心在辐射、延迟、发射和维护上的现实约束，也解释了马斯克把芯片、算力、模型与物理世界放进同一生态的长期意图。谈话随后转向英伟达的 AI
  工厂、异构计算和推理负载，以及金融、医疗等高监管行业对本地小模型的需求，最后落到 AI 基础设施创业、企业级商业化和并购退出。
core_ideas:
  - TeraFab 的价值在于把算力自主放进 SpaceX、Tesla 与 xAI 的全栈生态，而非只增加一座芯片工厂。
  - 太空数据中心短期仍受辐射、延迟、发射成本和维护条件限制，创业公司更适合先做 AI 基础设施或其他太空基础设施。
  - 英伟达把 GPU、CPU、LPU、网络、存储和软件平台组合成 AI 工厂，推理与 Agent 的持续运行让异构计算更重要。
  - 金融、医疗等高监管行业偏好本地或私有云的小模型，数据治理和隐私层是企业落地的前置条件。
  - To B 垂直 AI 让初创公司在企业数据边界内快速迭代，并购为 AI 基础设施团队提供了较短的退出路径。
