summary: |
  庄明浩、高飞和兰溪从豆包收费谈起，讨论生成式 AI 的推理成本、个人订阅定价、广告与运营商分销，以及模型公司面对的训练和基础设施投入。
  他们把盈利放回电力、芯片、数据中心、模型和应用的分工中比较，并从中美电力体系、企业生态和中国硬件供应链出发，讨论不同商业化路径的条件与限制。
core_ideas:
  - 生成式 AI 的每次推理都有成本；订阅、额度和加购机制试图在用户体验与重度使用成本之间取得平衡。
  - 豆包收费被嘉宾视为对中国个人订阅市场的一次试探，价格需要与具体场景和能力权益相匹配。
  - 大型模型公司的资金结构通常同时依赖成熟主业、外部融资和用户收入，资本开支不能只靠月费覆盖。
  - 芯片和基础设施目前更接近收入端；应用还要支付上游成本并承担获客与转化压力。
  - 中美在电力、企业软件生态和产业组织上条件不同，中国的硬件供应链可能支持更快的产品试作。
