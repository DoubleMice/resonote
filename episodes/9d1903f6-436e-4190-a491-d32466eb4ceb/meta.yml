summary: |
  录制当天，Travis Kalanick 宣布了 17 亿美元融资：食品、采矿（Pronto）与运输合并为单一实体 Adams，主打他重新命名的「工业 AI」——软件、机器人、传感器、机械一体的全栈自动化。他讲了自己如何飞去巴西深亚马逊的 Vale 铁矿和伊拉克-沙特边境的磷矿做企业级 GTM、为什么自主采矿能让矿山年产出提升 30~40%，以及 75 美分配送一个「自主卷饼」的食品全栈计划。后半段是管理哲学与世界观：招高管先看解题能力、联邦优先等于监管俘获、保险公司按事故赚 margin，以及「反人类的产品活不下去」的 AI 安全观。
core_ideas:
  - '$17 亿融资当天宣布：食品、采矿（Pronto）、运输合并进单一实体 Adams——头五个投资人的回答都是 "we wanna invest in you"，投资的是人而不是某个业务'
  - '采矿的 pitch 是一句话："would you like to have 20% more gold per year?" Pronto 已超过人类生产力，Travis 估算全部增益叠加后矿山年产出可提升 30~40%'
  - '落地瓶颈不在需求：旧机器没有线控，需要物理执行机构；发货、安装、调试校准、变更管理五步走，像企业软件 pilot 一样逐矿铺开'
  - '运输是 "wheelbase for robots"：不做人形机器人；食品配送用 75 美分对比 12 美元的 "autonomous burritos"，还有一年 35 亿美元人力成本的叉车机会'
  - '管理哲学：想象力的唯一约束是管理能力；招高管先看解题再看管理——"problem solving is the most important thing"'
  - '监管与保险的利益链：联邦优先等于监管俘获；保险公司按事故赚 margin——当年 DC 把 Uber 单次理赔责任推高到 150 万美元'
