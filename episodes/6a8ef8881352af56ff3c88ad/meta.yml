summary: >
  Raymond 从约两万份 LinkedIn 简历中整理出 Anthropic、OpenAI 与 DeepMind
  的人才轮廓：人员聚集在何处、来自哪些学校和前雇主、又分别承担哪些职能。节目不断强调样本缺失与分类口径，适合把它当作观察前沿 AI 实验室人才结构的一张近似地图。
core_ideas:
  - 公开档案只能显示趋势：约 1.9 万份可获取简历，经清洗后约 1.7 万份保留可用字段。
  - 湾区是最主要的地理中心；伦敦、都柏林、东京和新加坡构成海外节点。
  - 学校来源同时呈现集中与长尾：Anthropic 前 60 所学校覆盖 47.9%，其余一半员工来自 1,308 所学校。
  - Google 是 OpenAI 和 Anthropic 可见前雇主中最大的来源；收购 Statsig 也让 OpenAI 一次性获得 129 名员工。
  - 工程、研究、销售和共享职能的比例不同，不能把前沿实验室等同于研究员团队。
  - 中国背景、拼音姓名和语言标注是不同的统计口径，不能直接推出确切的华人比例。
