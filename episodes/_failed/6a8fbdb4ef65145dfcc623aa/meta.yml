title: 50. 一级半市场：水下私募，字节老股，三百公司求卖身？- 庄明浩 ｜屠龙之术
guest: 庄明浩
guest_role: 《屠龙之术》主播
tags:
  - interview
  - investor
  - strategic
summary: >
  庄明浩以 36氪资源榜五年多、约 180 期的 5000 多条信息为样本，解释未上市公司老股如何在一级与二级市场之间流动。访谈讨论了基金到期带来的退出压力、热门公司报价中的 FOMO、SPV
  与代持的结构风险，以及求并购线索能反映什么、不能证明什么。
core_ideas:
  - 一级半市场让未上市公司的持有人寻找流动性，但它不是透明、标准化的二级市场。
  - 同一标的的老股报价同时受业务表现、基金到期、卖盘密度和交易结构影响。
  - 36氪资源榜可以观察长期的买卖情绪与行业轮转，不能确认每条信息是否成交。
  - SPV、代持、币种与付款安排会改变买方取得的权利，也会增加交易链断裂的风险。
  - 求并购信息是退出需求的线索，不等于公司同意出售或收购已经完成。
