  - interview
summary: >
  OiiOii 创始人闹闹回顾了从动画爱好者、内容创业者到剪映和抖音特效产品负责人的经历，并解释为何在 AI 时代先做动画创作工具。团队把可编辑的多 Agent 工作流和模型编排用于 PUGC
  创作者，目标是先积累多样内容，再走向能够留住用户的内容社区。
core_ideas:
  - AI 创作产品不必照搬先社区后工具的短视频路径；丰富的内容供给应先于社区留存。
  - OiiOii 将用户放在导演位置：工作流可见、节点可编辑，自动化服务于创作控制而非完全取代它。
  - 团队优先服务 PUGC 自媒体创作者，在动画生产效率与内容多样性之间寻找产品空间。
  - 模型各有边界：保风格、保角色与稳定执行需要不同模型和工程规则配合。
  - 爆款可以带来新增，但社区能否留下用户取决于是否有持续、丰富的内容可消费。
