title: 中国一级半市场的水下江湖-续集｜串台苔藓之火
guest: Raymond
guest_role: 苔藓之火主播
tags:
  - startup
  - interview
  - investor
  - strategic
summary: >
  庄明浩与 Raymond 从一级半市场的交易线索出发，解释了基金退出压力如何催生未上市公司旧股的买卖，以及价格、结构和市场情绪如何交织。两人也讨论了 36
  氪长期留言板样本的价值与边界：它可以显示供需和行业关注度，却不能替代对单笔交易的核实。
core_ideas:
  - 一级半市场为未上市公司的老股提供流动性，但交易往往缺少统一的定价与标准结构。
  - 基金到期、上市窗口变化和行业轮转，会先反映在买卖线索的方向上。
  - SPV、代持和价格凭证降低了参与门槛，也让买方必须逐层确认权利和兑现条件。
  - 长期留言板样本适合观察市场情绪与热点，不能据此认定某笔交易已经成交。
  - 并购需求会在退出受阻时增加，但是否成交仍取决于公司、股东与买方的具体条件。
