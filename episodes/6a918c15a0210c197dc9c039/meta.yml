summary: |
  庄明浩与 Raymond 从基金退出压力出发，讨论未上市公司旧股如何在一级半市场中流动。对话以 36 氪资源版的长期留言板为样本，分析买卖意愿、行业轮转、价格形成与 SPV 等交易结构，同时强调线索并不等于成交。
core_ideas:
  - 基金到期而公司尚未上市时，旧股交易会成为持有人寻找流动性的渠道。
  - 一笔旧股报价同时受公司业务、卖方时间压力、供需和交易结构影响。
  - SPV 与代持能够拆低参与额，但会让权利、合规与兑现关系更复杂。
  - 长期留言板可以观察市场情绪和行业关注度，不能确认单笔交易是否完成。
  - 并购线索会在退出受阻时增加，是否成交仍取决于公司、股东和买方条件。
