summary: >
  Ben Wellington 介绍了 Two Sigma 如何把原始市场和文本数据转成可检验的特征，并用正交性、统计检验和持续监测控制重复信号与过拟合。访谈也讨论了 LLM
  如何压低探索成本、扩大公司特异性研究的规模，同时给模型生命周期、前视偏差和研究工具同质化带来新的约束。
core_ideas:
  - 特征是具有经济意义、可被检验的观察；人的假设先帮助研究收窄搜索空间。
  - 数据获取仍有价值，但数据更普及后，提出独特特征和使用方法的重要性上升。
  - LLM 能把结构化材料转成可研究的文本，也让原先成本过高的想法更容易进入实验清单。
  - 自动化若让所有研究者得到相同输出，会削弱组合需要的低相关性；工具应保留不同人的上下文与判断。
  - 更快的实验要求同步扩大统计检验、稳健性检查和模型生命周期控制。
