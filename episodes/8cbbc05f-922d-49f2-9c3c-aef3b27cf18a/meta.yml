summary: |
  33 岁的姚颂用十年走完三段创业：清华电子系毕业后放弃 CMU 全奖博士，与汪玉、韩松创立深鉴科技，
  见 50 家投资机构无人问津、被邓锋批评"纯技术人员的讲法"，却在成立两年多以 3 亿多美元卖给赛灵思——
  签完约高兴了"两分钟"就陷入灰暗。在经纬做了一年 Venture Partner、用排除法筛掉四个方向之后，
  他创立东方空间，把"好多快省"重排为好→多→快→省，让固体捆固体的引力一号首飞即成功，
  还办了第一次民营航天发射直播。2025 年他第三次出发，带着正大、华勤两大场景创立 Striding AI（阵行创新），
  坚定走隐空间+强化学习的路线：VLA"差不多走到头了"，具身智能"肯定没到GPT-2的时刻"，
  但泡沫"没有想象中那么大"。从掐表学满 11 小时的大一新生，到"八分进攻，两分防守"的连续创业者，
  这期节目是一个天才少年褪去光环、学会与自己和时代相处的完整记录。
core_ideas:
  - '三次创业一条主线：向外求是解决全人类生存空间、个体生存幸福、点与圆之间的社会这三大命题，向内求是看到技术原点一步步变成被很多人使用的产品的成就感'
  - '深鉴诞生：毕设四人组加韩松互相壮胆；见 50 家机构无人投，被邓锋批评"纯技术人员的讲法"后学会从万亿级市场倒推；拒绝英伟达、英特尔只选赛灵思，2018 年年中以 3 亿多美元被收购'
  - '卖掉深鉴后"踱步了两分钟以后，我的人生就陷入了灰暗"：张颖说"你不需要现金，你需要足够多的信息"；用排除法（激光雷达/脑机接口/国产 GPU/核聚变）找到"从相对前沿的技术然后到它可以规模化工程化"的赛道'
  - '东方空间：把"好多快省"重新排序为好→多→快→省；固体捆固体的罕见构型、船上发射，引力一号 2024 年初首飞即成功；第一次民营航天发射直播是姚颂的点子——"航天不应该跟普通人这么遥远"'
  - 'Striding AI 的路线：物理智能不等于具身智能（空间感知+本体+数据算力模型+远程遥操+场景）；VLA"差不多走到头了"；在隐空间里学物理定律和物理常识，而不是预测每一个像素'
  - '数据是胜负手：正大 40 多万员工、上万家门店带来"把我的数据成本下降到正常市场采购价的十分之一以下"；曹旭东十年前的判断是"50%是数据，30%是算力，20%是人的经验和灵感"'
  - '全栈垂直整合会是未来三到五年的主流方向，他断言机器人行业"在10到15年这个周期就会超过整个汽车行业的产值"；泡沫"没有想象中那么大"，地平线和 Momenta 是参照系'
  - '他的底线：demo 视频必须标注加速倍数与"全自主"——"我有些话可以不说，但我说出来的话一定是真话"；投资心态"八分进攻，两分防守"，"我不会进去，我也不会变成一个破产户"'
