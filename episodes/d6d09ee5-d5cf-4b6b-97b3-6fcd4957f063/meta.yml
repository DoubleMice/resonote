summary: >
  Fusion Fund 创始合伙人张璐从企业客户的角度解读 Anthropic 招股书，讨论编程之外的 AI 需求、客户留存和算力支出。她结合接触大型企业的经历，分析企业部署、成本与数据约束，以及医疗、基础设施和监管领域的机会与不确定性。
core_ideas:
  - 张璐关注 Anthropic 的企业客户留存、增购与非编程收入，同时警惕收入增长和长期算力投入之间的压力。
  - 企业常先在现有流程中试点自动化，再考虑调整业务；张璐预计大规模部署需要数年，节奏未必像编程工具一样快。
  - 大企业预算增加不等于回报已经验证，同行竞争、数据隐私和使用成本都会影响采购与部署。
  - 受监管行业的本地部署、推理降本和细分应用可能为初创企业提供机会，但简单应用也面临模型公司的竞争。
  - 算力总需求增长可以与某些设备闲置、旧一代 GPU 租金下跌同时发生；物理 AI 部署还需要处理安全和监管问题。
