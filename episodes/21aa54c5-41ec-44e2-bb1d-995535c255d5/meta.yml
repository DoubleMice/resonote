summary: |
  曼琪以 2025 年的模型进展、Agent 应用、巨头竞争、创业融资、具身智能与 AI 硬件为线索，回顾技术如何进入产品和组织。
  节目也把视角放回使用者：当工作内容与人才市场被重写，人如何在效率变化中保留经验、关系和意义感。
core_ideas:
  - 推理、编程、多模态与工具调用的进步，推动 Agent 从演示走向更完整的工作流
  - 模型竞争依赖芯片、基础设施、算法、模型和产品之间的协同设计
  - 应用能否留住用户，取决于具体场景、入口权限、交付结果与持续使用习惯
  - 中国 AI 创业同时面对巨头竞争、融资环境与全球化合规条件
  - 具身智能的关键仍是数据、模型和硬件本体能否共同满足真实场景的要求
  - AI 改变工作后，人的体验、沟通与自我认同仍不能由工具代劳
