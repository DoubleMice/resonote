summary: |
  潘乱、Koji 与庄明浩从 Open Claw 的使用热潮聊到模型能力跃迁、算力投入和企业智能体。讨论没有把这些变化写成确定预言，而是把风险推演、工作流改造、硬件终端、获客与信任放回各自的条件中。
  对个人和小公司而言，节目给出的落点是从高频重复任务试起，同时承认做出产品与获得用户仍是两件不同的事。
core_ideas:
  - Open Claw 的价值之一，是促使使用者把库存查询、信息搜集等日常需求重新拆成可委派的任务。
  - 模型能力提升会让按席位收费的 SaaS 面临想象中的冲击，但替代速度和经济后果尚无定论。
  - 高强度 AI 编程不能脱离需求定义、质量检查和基础设施；局部 Token 消耗不等于整体效率。
  - 漫剧案例显示，人与 AI 的协作依赖清楚的环节、交付物和衔接工作。
  - AI 降低产品制作门槛后，冷启动、分发和信任仍是个人与小公司必须解决的问题。
