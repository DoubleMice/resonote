summary: |
  哈比布回顾达吉斯坦的训练环境、父亲的教育以及从少年比赛到 UFC 冠军的经历，也解释退役后如何指导新一代选手。访谈还谈到他对足球、信仰和成名的看法。
core_ideas:
  - 达吉斯坦的格斗传统依靠教练、训练伙伴和逐级竞赛的机会，不能只用艰苦条件解释。
  - 父亲安排阅读和跨项目比赛，让哈比布学习知识，也逐渐适应竞技压力。
  - 哈比布靠严密备战应对不愿输的心理，并认为选手需要反复面对赛前恐惧。
  - 父亲去世、伤病和与母亲的约定，共同影响了他在对阵盖奇后退役的决定。
  - 执教需要了解每位选手的状态；信仰则帮助他面对丧亲、成功与责任。
