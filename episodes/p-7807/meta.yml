summary: |
  三位研究者讨论节目所述的 AI 数学证明，包括准黎曼猜想、纳维–斯托克斯方程的一个反例和唯一博弈猜想，并解释这些结果的条件与尚存的问题。对话还涉及形式化验证、人类理解、研究职业和 AI 辅助学习的变化。
core_ideas:
  - 准黎曼猜想的结果扩大了无零点区域，但完整的黎曼猜想仍未解决。
  - 光滑外力条件下的流体方程反例揭示了数学上的可能性，湍流预测和工程设计仍然困难。
  - 唯一博弈猜想关系到近似算法的理论界限，而最坏情况难度不等于所有实际实例的难度。
  - Lean 能检查形式化证明，人仍需判断命题是否符合原意，并理解证明的方法与意义。
  - AI 改变年轻研究者的职业预期，也让教学、审稿和研究合作面临新的选择。
