summary: |
  Momenta 上市后，曹旭东再次接受《晚点聊》采访（六年里的第四次），复盘十年创业的判断与取舍：城区 NOA 市场上
  Momenta 与华为合计市占率达 90%，智驾摩尔定律从两年十倍加速到每年十倍，2028 年城区 NOA 将达到
  人类水平。他讲透了自己 2016 年靠量纲分析推出 1000 亿公里数据需求、从而选定飞轮战略的完整推演，
  也首次详细解释 2027 年进入具身智能、2030 年家庭机器人拐点的判断依据，以及一个 World Model
  支撑所有自动驾驶应用的底座逻辑。
core_ideas:
  - '智驾竞争窗口在 2026 年底关闭：Momenta 与华为合计占城区 NOA 约九成份额，两家有比较强的定价权，先发优势加规模优势会让格局继续集中'
  - '智驾摩尔定律加速到每年十倍：2023 到 2026 每年一个技术突破（Deep Learning Planning、端到端、强化学习、World Model），底层都是模型吃掉更多数据'
  - '1000 亿公里的推演是飞轮战略的起点：无人驾驶要比人类安全十倍、统计验证要放大百倍，自有车队不可能采到这么多数据，只能靠量产'
  - '一个 World Model 支撑量产、RoboVan、RoboTruck、RoboTaxi 全部应用，底座提升十倍则每个应用提升十倍'
  - '机器人是第三条曲线：2027 年开始投入，2030 年家庭机器人进入规模化商业化拐点，本体成本要做到一万美金，复用度可能达到 80%'
  - '上市最重要的战略目标不是融资，而是品牌和信任；财务节奏是 2027 年打平、2028 年盈利'
