summary: >
  明浩以“素材之死、流程之死、版权之死”为框架，讨论生成式 AI 如何改变内容生产的对象、短剧的制作与分发方式，以及内容权利的资本含义。演讲从世界模型与短剧讲到
  AlphaGo、现代艺术和文艺复兴，最后把问题留给创作者：工具与资本已经在场，人类愿景仍要由人提出。
core_ideas:
  - 生成式 AI 在 ChatGPT 发布前已按文本、图像、视频、语音和 3D 等模态展开，视频模型正追求连续性、可控性与协作能力。
  - 世界模型可分为渲染、物理模拟与计划三类；演讲用它说明素材可能从逐件制作转向描述所需的对象与行为。
  - 短剧经历了真人付费、真人免费、AI 漫剧到真人 AI 剧的相邻阶段，播放、点击和热度也进入生产与分发的反馈循环。
  - AlphaGo 与李世石的对局提醒人们，机器在胜负上占优之后，围棋仍可被视为文化、艺术与创作。
  - 文艺复兴的第四根支柱是全新的人类愿景；情感、信任与决定构成演讲留给创作者的问题。
