summary: |
  本期围绕微策略首次小额卖出比特币、STRC 跌破面值，以及可转债回购后现金储备变薄展开。嘉宾将风险落在融资结构的反身性：比特币、MSTR 股票、STRC 价格和付息能力彼此影响，市场的信心会改变公司可用的融资路径。
core_ideas:
  - STRC 从 100 美元跌至 82.5 美元，显示市场开始重新定价其票息、价格稳定性与公司信用。
  - 嘉宾认为，15 亿美元可转债回购压低现金储备，使市场更担心优先股利息最终会不会由卖币支付。
  - 清偿顺位提供静态安全垫，但价格下跌时的提前抛售和融资收缩会形成另一类动态风险。
  - 讨论者建议优先恢复至少 12 个月的现金覆盖期，再考虑继续通过 STRC 或股票融资买入比特币。
  - 比特币网络的运行与围绕比特币建立的公司债务、优先股和杠杆结构应当分开判断。
