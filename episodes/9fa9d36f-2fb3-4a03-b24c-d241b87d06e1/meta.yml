summary: |
  高岱恒从千问团队变动后的人才搜索变化讲起，解释开放模型如何借由模型社区、论文与开发者反馈形成影响力。他也回顾自己的开源经历和 AI 研究者故事，并讨论了以公开作品发现人才、以 Agent 改变招聘与任务协作的可能性。
core_ideas:
  - 千问的模型家族与开源生态，让它成为研究和应用中常被采用的模型选择。
  - 研究者的论文、代码和模型项目正在成为能力证明，也让非传统背景的人有机会被发现。
  - DINQ 尝试聚合分散的公开信息，让招聘方用自然语言寻找具体方向的候选人。
  - 高薪前沿研究背后是复杂实验系统、长期挫折与对代表作的追求。
  - Sam 推演：AI 若压缩需求对齐和执行时间，人才服务可能从长期岗位延伸到更短的任务匹配。
