title: 28. 今年量化指增还能上车吗？会接盘吗？ - 串台｜慧客堂
guest: 董老师
guest_role: FOF 管理人
tags:
  - interview
  - investor
  - strategic
summary: |
  台险之火与慧客堂讨论量化指数增强在 2025 年的高回报之后，面对 2026 年轮动行情应如何理解。董老师从指数基准、超额收益的来源、因子拥挤与管理人筛选谈起，强调年度排名无法替代对风险暴露和资金期限的核查。
  节目中的市场与资产配置判断均为受访者在录制时点的观点；个人配置还需匹配自身的流动性需求与回撤承受力。
core_ideas:
  - 量化指增需要拆成 Beta 与 Alpha：先确认跟踪的指数，再追问超额收益的来源和风险暴露。
  - 受访者认为，2025 年后沪深 300、中证 500、1000 和 2000 的增强空间随行业结构与经济周期发生变化。
  - 微观分化、有序轮动、可识别的资金进出和可操作的扰动，才会为量化策略留下超额空间。
  - 困难市场中的单次高分可能来自集中因子暴露；筛选策略要防范幸存者偏差。
  - 管理人排名表只能作为入口，仍须核查真实完整的数据、研发迭代能力与风险管理。
  - 严格跟踪基准的指增可承担组合进攻角色，但资金期限、流动性和基准回撤决定是否适配。
