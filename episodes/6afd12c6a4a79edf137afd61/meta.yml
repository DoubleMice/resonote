summary: |
  蚂蚁灵光负责人蔡伟回顾产品从信息整理、闪应用到个人智能体的演进，解释模型能力、服务供给和安全信任如何影响产品体验。对谈还讨论普通人的助理需求、通用与垂直产品的竞争，以及成本、补贴和未来入口的不确定性。
core_ideas:
  - 个人智能体以持续管理事项和主动服务为方向，但提醒频率和个人记忆的调用需要根据用户与任务调整。
  - 接入服务需要逐个打磨接口和交易体验，涉及支付及个人数据时还需要明确权限和安全机制。
  - 通用助理能否胜过垂直产品，与服务供给的开放程度和用户实际体验有关，目前难有定论。
  - 用户是否愿意使用和付费，取决于产品提供的价值及成本；算力降价和大众需求增长仍是蔡伟的预期。
  - 产品团队既要理解模型和训练边界，也要观察事项完成与放弃等指标，避免只追逐单一增长数字。
