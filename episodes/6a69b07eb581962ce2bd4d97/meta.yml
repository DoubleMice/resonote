summary: |
  清华大学人工智能学院助理教授、元环智能首席科学家刘子鸣分享了他从北大物理到 MIT、再到回国创业的学术与创业历程。
  他提出了 AI for AI 的独特路线——AI for Physics of AI for AI，强调在自动化研究之前必须先通过物理学方法论理解 AI 的内部机制。
  刘子鸣深入剖析了 2026 年中美 New Labs 的资本狂潮、元模型的可行性、OPHIS 结构化研究框架，以及"Vibe Training"——让每个人都能够训练自己模型的终极愿景。
core_ideas:
  - '从物理到 AI：刘子鸣的学术旅程始于对物理"盛宴已过"的感叹——大二时被 GAN 网络吸引，从此走向 AI 与物理的交叉之路'
  - 'KAN 网络的诞生：从神经网络与符号公式的"波粒二象性"出发，刘子鸣重新发现了 Kolmogorov-Arnold 定理，用两周做出原型，克服了 1989 年的"不可能证明"'
  - 'Physics of AI 三维度：空间上更细（解剖 AI 内部）、时间上更细（演化视角）、平行宇宙间（控制实验与相图），三个维度构成理解 AI 黑盒的物理学方法论'
  - 'AI for AI 的独特路线：主流是 Coding Agent 直接做研究（更勤奋），刘子鸣主张先经过 Physics of AI 积累理解再优化（更聪明），即"AI for Physics of AI for AI"'
  - '元模型与 Vibe Training：60 天把自己当模型训练的人体实验让他相信元模型是可能的——输入模型架构，预测训练曲线，终极目标是实现人人可训模型的 Training Autopilot'
  - '2026 年 New Labs 资本狂潮：中美同时涌现大量新型实验室，融资节奏极快，刘子鸣亲历"太疯狂了"的连续融资过程，国内投资人"恨不得当天就能盈利"'
