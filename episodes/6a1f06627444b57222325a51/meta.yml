summary: >
  百观科技 CEO Robert
  讲述面向海外投资人与企业高管的中国考察团：行程把企业参访、自动驾驶试乘和消费体验放在一起，帮助团员修正对中国的抽象印象。讨论同时保留了机器人数据不足、自动驾驶短期扩张受就业与监管约束，以及消费价格压力仍在的条件。
core_ideas:
  - Robert 感到，海外读者对中国的关注正从把它当作销售市场，延伸到研究企业、产品和制造现场。
  - 考察中的大模型和制造软件企业显示，来访者会追问人才来源、技术路线与制造数据能否转化为新业务。
  - 机器人本体已有可见进展，但遥操作采集数据、核心部件供应和通用能力何时成熟仍是未解问题。
  - Robert 认为，中国自动驾驶的服务范围受短期就业与试点管理影响；这与长期老龄化带来的发展需求并存。
  - 亚朵、江南布衣和老乡鸡等体验让团员看到价格与服务的结合；这不抵消消费者谨慎和价格下行压力。
