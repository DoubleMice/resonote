summary: >
  庄明浩以 2026 年 1 月的视角，回看 2025 年美国和中国 AI
  行业的模型、产品、基础设施与资本变化。他把美国的高强度数据中心投入、应用与模型的收入压力，同中国的开源模型、超级应用和硬科技融资放在一起，也保留了商业回报与两国长期格局尚无定论的部分。
core_ideas:
  - 模型研发的重心从预训练延伸到后训练、可验证强化学习环境和长任务执行；语言、多模态与编程被放进同一类任务能力中讨论。
  - 编程和医疗是节目重点观察的场景，但调用增长、市场估算和产品推出不能直接证明企业已经盈利。
  - 美国 AI 扩张把芯片、云、数据中心、债务和折旧连在一起；需求增长不等于产业链各层都能得到相同回报。
  - DeepSeek R1 之后，中国开源模型的竞争更密集；大公司也在把 Agent、生态服务和既有业务重新组织进产品入口。
  - 节目把中美看作可能并行的两套系统：能力、算力成本、能源、部署和市场网络都会影响后续走向。
