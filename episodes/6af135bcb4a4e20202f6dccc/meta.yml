title: 从 3.9%时间占比到"字节时间"，我们是怎么走到这儿的？
guest: 庄明浩
guest_role: 《屠龙之术》主播、投资人
tags:
  - panel
  - strategic
  - ai-products
summary: |
  佳雪与庄明浩从围绕字节时间的公开争议出发，梳理了移动互联网从用户规模竞争转向注意力竞争的过程。对谈区分了使用时长、平台实力和法律意义上的市场支配地位，并讨论 AI 为既有巨头带来的增长与监管难题。
  红果短剧的增长让注意力分配变得格外可见；两位主持人也认为，平台面对批评时的回应会改变一场行业讨论如何演化。
core_ideas:
  - 2017 年 6 月，QuestMobile 图表中腾讯系使用时长占比约为 54%，当时的今日头条系为 3.9%。
  - 移动互联网进入存量阶段后，平台同时争取用户数量、使用时间和收入，三项指标不能互相替代。
  - 注意力集中不等于法律上的垄断；市场边界、经营者集中和具体行为都会影响反垄断判断。
  - AI 可能让头部平台获得新的增长曲线，但个人智能体会否成为新的流量入口仍未有定论。
  - 合规和公平竞争需要进入日常业务决策；舆情中企业也很难准确拆分批评、围观与竞争动机。
