summary: >
  明浩以近一个季度的模型发布、企业支出和产品动向为线索，讨论模型供给加速后，企业为何开始按成本、数据和任务重组自己的智能能力。节目也梳理了训练与评估服务的商品化、AI 参与改进 AI 的循环，以及办公 Agent
  和个人助理仍未收敛的界面方向。
core_ideas:
  - 高频发布让版本、价格和演示效果都成为模型竞争的一部分，榜单难以独自说明真实价值。
  - 企业选模型时同时权衡成本、速度、效果和数据掌控，最强模型不再自动等于最合适的智能。
  - 基准、训练环境、Harness 和评估正在形成新的服务分工；Harvey 是节目中的法律领域实施案例。
  - AI 可进入训练和评估的反馈循环，但物理世界以及弱验证、难编辑的任务仍构成明显边界。
  - 办公 Agent 的数据口径尚不统一，个人助理如何消化复杂度仍没有标准答案。
