summary: >
  一场单人演讲以 2026 年 4 月的图表和案例为线索，讨论 Agent 与 Harness 如何改变模型产品，coding 为何在当前竞争中居于中心位置。演讲随后转向模型公司的用户与收入指标、SaaS
  和科技股的重估、数据中心投资及其地方成本，最后落到 AI 加速带来的焦虑和个人选择。
core_ideas:
  - 演讲者把 Agent 的进展归因于模型之外的 Harness，包括上下文、记忆、工具权限、反馈和任务编排。
  - coding 已从代码补全扩展到生成、评审和调试，因此被演讲者视为通用数字任务的重要入口。
  - OpenAI 与 Anthropic 的竞争需要分开看用户规模、留存、企业采用和 ARR，收入数字本身也有统计口径差异。
  - 多模态应用、开源模型和模型价格共同改变竞争格局，产品关闭也可能是有限算力下的资源取舍。
  - 大规模 Capex 支撑了数据中心和硬件需求，同时令自由现金流、审批、建设进度和地方生活成本成为约束。
  - 演讲把 AI 短剧投放、软件估值压力和数据中心争议放在一起，提醒技术增长的收益与代价不会平均分配。
