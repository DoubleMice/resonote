summary: |
  洋葱学院联合创始人兼 CEO 杨临风做客晚点聊，讲述这家 13 岁教育科技公司如何用 5-8 分钟动画视频推动学生自主学习：1.3 亿注册学生、400 万注册教师，却从没做过直播课与拍照搜题，2022 年全年打平。面对 AI 热潮，他认为纯大模型还讲不透中小学的系统二学习，教育交付的是过程而非结果；洋葱把 AI 当作规划器与策略分发器，与公立学校共建"师生机三元课堂"。
core_ideas:
  - '自主学习由意愿、能力、工具、信念四要素构成，最终落到"我能独立完成"的信念系统'
  - '学习反人性是因为系统二能耗高：工具的作用是把自主学习的门槛降下来，让正向循环转起来'
  - '5-8 分钟视频与 10 万成本背后是成就闭环与质量门槛："花了 50 块产出也是 0，花到 80 块产出才开始走向"'
  - '反共识创业：每个学渣心中都住着想成为学霸的心；不做直播课与拍搜，因为人机交互才能普惠复制'
  - 'AI 的边界：大模型语料高度逻辑化，与中小学生认知存在 gap，目前还讲不透系统二知识；教育交付的是过程'
  - '洋葱把 AI 定位为规划器与策略分发器，通过 AI 未来课堂与公立学校共建师生机三元课堂，十年目标帮助五百万、一千万孩子'
