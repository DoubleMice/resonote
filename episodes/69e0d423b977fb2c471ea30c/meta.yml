summary: |
  庄明浩与知本论从 OpenClaw 热潮谈到 Agent 的使用门槛、权限风险和 Token 消耗。节目也讨论了开源生态、早期投资、国内外采用差异与市场周期：能力和需求在增长，但商业回报、现金流与泡沫所处阶段仍没有确定答案。
core_ideas:
  - OpenClaw 把模型接入记忆、工具、文件和通信渠道；复杂任务仍依赖用户提供标准、资源和反馈。
  - 个人可较快尝试 Agent，企业则要同时处理流程、数据、安全、隐私、权限和组织机制。
  - Token 是复杂任务的燃料，消耗扩大后会传导到数据中心、电力和基础设施的紧张程度。
  - 开源项目的价值不只在软件本身，也体现在传播、贡献者与安装、培训、硬件、Token 等周边生态。
  - AI 降低试错成本，却没有取消需求、收入和现金流的约束；投资选择仍取决于阶段与风险承受能力。
