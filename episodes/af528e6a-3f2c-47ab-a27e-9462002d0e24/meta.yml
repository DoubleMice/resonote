summary: |
  本期 TBPN 涵盖四大主题：Leopold Aschenbrenner 的 Situational Awareness 基金月内回撤 67% 但未清盘，Citadel 接手公开组合；Numerai 创始人 Richard Craib 深入剖析 Alpha 与 Beta 的区别，强调数学风险管理和长期生存优于短期爆发；Anduril 联合创始人 Trae Stephens 介绍 Fury 战斗机下线、Thunder 自主直升机以及国防采购体系的十年变迁；BRINC 创始人 Blake Resnick 展示无人机产品矩阵与 Motorola 战略合作，探讨美国无人机供应链的创业机会。
core_ideas:
  - 'Leopold 事件的根本教训：风险 = 波动率²，问题不是杠杆本身，是高波动 —— Richard Craib 的 Numerai 用更高杠杆但十分之一的波动率验证了这一点'
  - 'Alpha 是唯一无法自己买到的东西：LP 可以自己买 Anthropic 股票、做多 MicroStrategy，这些是 Beta。对冲掉所有已知风险因子后剩下的正收益才是基金经理的真正能力'
  - 'Anduril 的制造速度：Arsenal One 工厂从空地到 Fury 战斗机下线仅 18 个月，关键策略是提前在加州培训团队、与地方经济发展机构深度合作、确保稀土等战略资源的采购权'
  - '国防采购体系已改善但关键瓶颈未破：DIU、AFWERX、StratFI 等新通道使创业公司更容易获得早期资金，但从千万级研发到数十亿级量产采购的通道仍然依赖传统承包商'
  - '无人机 911 响应市场几乎空白：美国 8 万多个警消站点中目前仅有约 1% 部署了响应无人机，BRINC 的 Motorola 合作提供了现成的客户关系和产品集成基础'
  - 'VC 估值的双刃剑：10 亿美元种子轮在某些情况下合理，但很少有团队能在手握巨资时保持纪律。Anduril 选择每轮 2 倍 markup 稳步推进，而非追求最高估值'
