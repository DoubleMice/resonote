summary: |
  梁杰从早期推荐却未投成拼多多的经历出发，讨论 AI 投资中软件基础设施、行业部署与智能体经济三类机会。他认为垂直应用的关键是嵌入工作流，同时要把真实需求、动态竞争和市场深度放在同一套判断里。
  节目最后回到 AI 会如何改变 VC：理性分析可以被工具加速，但创始人与投资人之间的连接、风险偏好和经历史形成的品味，仍会影响相近项目之间的取舍。
core_ideas:
  - 拼多多的经历提醒梁杰：既有框架能排除失败模式，也可能错过范式变化。
  - 团队把 AI 机会分为软件基础设施、行业部署和尚未定型的智能体经济。
  - 行业部署要理解工作流并完成接入；它与可直接使用的知识类产品有不同的扩张速度。
  - 评估 AI 公司要看问题、AI 的必要作用、市场规模，以及优势在竞争中会被放大还是削弱。
  - 梁杰偏好平台型赢家，但在机会尚未清晰时也会评估中等规模的优质项目。
  - 他认为 AI 时代的 VC 仍依赖人与人的信赖、风险排序和经验形成的判断尺度。
