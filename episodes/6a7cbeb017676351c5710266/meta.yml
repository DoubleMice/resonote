summary: |
  本期是英伟达研究副总裁、Cosmos Lab 负责人刘洺堉的 4 小时深度访谈，录制于黄仁勋访华后一个月。他从 20 年前的求学之路讲起——从台北交大的无线通讯，到马里兰大学的计算机视觉博士，再到加入英伟达做生成式研究的完整脉络。访谈核心是 Cosmos 世界模型：从 Sora 之后的一封联名信立项，到黄仁勋"你就做到 Cosmos 97"的期许，再到 Cosmos 3 把 22 个模型统一为双塔架构、把语言视频音频动作四种模态融进一个模型。他也分享了近距离观察英伟达的十年：不裁员、Top 5 邮件、Mission is the boss、"Are you a crybaby?"，以及他对模型竞争终局的判断——模型能力终将收敛，你不需要击败所有对手。
core_ideas:
  - 'Cosmos 3 的世界模型统一：从需要 22 个模型到 1 个双塔模型，黄仁勋用 Louis Vuitton 减少货品陈列反而提升销售的比喻点明方向'
  - '物理世界模型的第一公民是 action：语言、视频、音频、动作四种信号描述同一个世界，MoE 首次以如此规模融合 Audio/Video/Action'
  - '为机器人构建黑客帝国：世界模型帮 Physical AI 泛化的三种方式是更好的数据、更好的起点、更好的环境'
  - 'Physical AI 的 ChatGPT moment：人示范一次操作、机器人就地学会——他认为这必然发生，只是时间未定'
  - '黄仁勋的领导力：零十亿美元生意、30 天现金流危机感、pace your steps、torture you to greatness、六边形战士'
  - '你不需要击败所有对手：模型能力终将收敛，竞争靠生态整合；具备 number one 的能力，但做出对世界贡献最大的事情'
