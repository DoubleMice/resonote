summary: >
  马克汤从办公 Agent 的广告战切入，讨论大厂拥有资源却常难做出 AI 原生产品的组织原因：目标被拆散、旧业务牵制创新，独立团队和清晰的内部结算可能带来不同结果。对话也把视线转向 OS、Super App 与垂直 Agent
  的入口争夺，以及 AI 产品从日活转向产出和商业化的评估方式。
core_ideas:
  - AI 原生产品应解决过去做不到或难以规模化完成的任务，不宜只给旧流程加一个对话框。
  - 大厂的局部理性会让算法、产品和增长团队各自达标，却未必汇成更好的用户体验。
  - OS Agent、Super App 与垂直子 Agent 竞争的关键，是谁直接面对用户并保有完整上下文。
  - 办公 AI 的评估要看对话轮次、负反馈、留存和商业化，而不只看日活、月活。
  - 访谈预计未来 12 个月的竞争仍以办公场景为主，先服务价值较高、流程已数字化的知识工作。
