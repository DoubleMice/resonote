summary: |
  TBPN 在 AMD Advancing AI 2026 大会现场直播，Lisa Su 宣布 Helios 机架系统、与 Anthropic 的 50 亿美元合作、以及与 Cerebras 的推理扩展。Oliver Cameron 解析世界模型的 GPT-2 阶段，Mohammad Norouzi 探讨企业级 AI 设计，Anjney Midha 提出"Output Maxing"理念应对美国数据中心仅 15% 算力利用率的危机，Seth Cohen 揭示核废料中蕴藏的能源潜力。
core_ideas:
  - AMD 发布 Helios 机架系统与 MI450 加速器，从芯片供应商向全栈 AI 基础设施平台转型
  - 'AMD 与 Anthropic 签署 50 亿美元合作协议，部署高达 2GW 的 MI450——Anthropic 用 Claude 自主完成 MI355 适配'
  - Lisa Su 坚持异构计算哲学——"这个世界是异构的，没有一刀切的解决方案"
  - Oliver Cameron 将世界模型定位为 GPT-2 阶段的基础设施，认为它将和语言模型形成互补：一个统治虚拟/物理世界，一个统治代码/文字
  - Anjney Midha 提出 Output Maxing 理念——美国数据中心仅 15% 算力被利用，85% 浪费是国家安全危机
  - 中国在纯规模上拥有结构性优势（100GW 能源、命令式协调），美国必须通过效率、RL 验证飞轮和初创公司创新密度来应对
