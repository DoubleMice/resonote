title: 34. 从美元到人民币基金 — 科技投资新范式？ | 对话苏麟
guest: 苏麟
guest_role: 织之资本联合创始人
tags:
  - startup
  - interview
  - investor
  - strategic
summary: |
  苏麟回顾自己从美元中后期投资转向人民币基金的过程，解释投资阶段、LP 构成与项目决策为什么会随之改变。访谈把重点放在硬科技的产业链尽调、科学家创业的投后协作，以及退出渠道和红筹架构带来的现实约束。
  他的基金用早期技术项目和后期链主企业构成杠铃策略，试图让下游需求反向校验上游创新；对未来，他仍把能走向全球市场的中国企业视为机会。
core_ideas:
  - 美元中后期投资与人民币早期科技投资的区别，既来自币种，也来自项目阶段、机构规模和决策机制。
  - 杠铃策略把早期技术项目与后期链主企业放在同一组合，重点是用终端需求校验上游创新。
  - 硬科技投后需要帮助创业者接近客户、谈合作与补团队，但必须审慎处理知识产权和经营边界。
  - 退出路径需要在立项时讨论；上市、部分老股转让和 S 基金分别处理不同的流动性问题。
  - 红筹架构的监管影响仍不明确，访谈记录了从业者对资产、人才和税务问题的观察。
