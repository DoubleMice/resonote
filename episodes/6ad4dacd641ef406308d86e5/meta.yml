summary: |
  科沃斯 CEO 钱程回顾从电商、海外业务到接班的经历，讲述战略方向与组织能力之间的落差，以及与父亲、老员工重新建立工作关系的过程。他也讨论家用机器人新品类、市场竞争和具身智能，并解释为何对机器人进入家庭的速度保持谨慎。
core_ideas:
  - 钱程2012年进入家族企业时并没有明确的接班时间表，海外业务成为他学习经营的重要阶段。
  - 管理整家公司后，他发现原有组织依赖创始人的经验和信任，管理变革需要配套的制度与磨合。
  - 国内外业务整合及商用机器人尝试，让他意识到扩张目标必须考虑团队能力和执行节奏。
  - 新品类选择要结合已有技术、交付和渠道能力，也要考虑市场规模；品牌不能替代持续的产品交付。
  - 他预计具身机器人可能先在较标准化的商业或工厂场景落地，进入家庭仍需要更长时间。
