summary: |
  明浩以文艺复兴为线索，梳理 2026 年上半年 AI 行业中硬件、资本、模型、世界模型与智能体的变化。他把快速增长的基础设施投资与现金流、债务和商业回报放在一起考察，并将讨论落在治理与人的位置上。
core_ideas:
  - AI 资本开支正在流向芯片、存储、网络和能源，存储在数据中心成本中的位置上升。
  - 模型竞争同时受闭源前沿能力、开源扩散和后训练应用影响，中美技术路径存在差异也彼此渗透。
  - 世界模型涵盖渲染、物理模拟和行动规划，不同公司对核心技术路线尚无统一答案。
  - Agent 将交互从单轮对话推向任务执行，代码与可调用接口成为产品竞争的重要部分。
  - Token 消耗不能代表最终商业价值，ROI、治理和人的责任仍是下半年的关键问题。
