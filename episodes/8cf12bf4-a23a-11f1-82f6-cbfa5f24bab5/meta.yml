summary: |
  本期对谈围绕财政部对伊朗的次级制裁公报展开：公报把数字资产与数字资产中介列入考察名单，Kane Warwick、Taylor Monahan 与 Coin Center 执行董事 Peter Van Valkenburgh 一起拆解 DeFi 被"点名但不点名"的处境、稳定币二级市场的冻结义务边界，以及 Bessent 宣称已从伊朗人手里扣押约 10 亿美元加密资产背后的规模与情报协作问题。下半场聚焦 Roman Storm 重审推迟到 2027 年 4 月：Rule 29 无罪动议、SDNY 的"平底锅导热"理论、Berman 修正案对"交易与信息"的法定豁免，以及 Tornado Cash 作为零知识密码学第一次大规模实战的遗产。最后还讨论了 SEC 的 Reg Crypto 两条募资通道、Hyperliquid 被总统发布会点名后的 CFTC 管辖之争。
core_ideas:
  - 'Treasury 公报未点名 DeFi，但把数字资产与数字资产中介列入次级制裁考察对象，并留下"任何经济生命线都可成为目标"的宽泛措辞'
  - 'Peter 主张先打人再谈协议：交易所、壳公司与人类经纪人是有 agency 和资金控制权的合理目标，按帕累托法则可切断约 80% 的通道'
  - '稳定币是最可能的绕制裁向量：公链可实时审计，GENIUS 规则要求发行方冻结能力伸进二级市场，但持有者不是客户——"否则和 Venmo 没区别"'
  - 'Roman Storm 重审推迟到 2027 年 4 月，Rule 29 无罪动议待裁；一审仅无照资金传输罪定罪，制裁与洗钱两项因陪审团分裂而悬而未决'
  - 'Berman 修正案禁止制裁"交易与信息"，Peter 认为 Roman 发布的是软件与链上信息，不能因他人用它转账而定罪'
  - 'Tornado Cash 是零知识密码学第一次大规模实战，且是极少数不可变、未被攻击、被大量使用的合约之一——起诉它反而是稀缺执法资源的错配'
