summary: |
  顾全全回顾在字节参与 AI 制药与豆包预训练的经历，解释结构预测、药物设计和大模型规模扩展之间的关系。他也讨论训练稳定性、团队协作、湿实验和创业计划，并分享对学术研究与工业研发的不同取舍。
core_ideas:
  - 顾全全称，Chai 2 的结果促使团队转向结构设计，并以 SeedFold 为基础训练 Seed Protein。
  - 扩大模型需要匹配数据、算力与训练方案，小模型实验的结果也需要验证能否迁移到更大规模。
  - 大模型训练需要跨团队检查和充分调研，训练失败可能带来时间与算力损失。
  - 他计划将湿实验结果用于模型后训练，并设想向药企提供按任务计费的模型服务。
  - 学术训练有助于培养研究方法，工业研发则提供资源与竞争环境，但成果也可能无法公开。
