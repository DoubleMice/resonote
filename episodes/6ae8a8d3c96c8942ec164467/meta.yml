summary: |
  Joey Wang 结合 Harvey 的法律 AI 产品，讲述了垂直应用如何把模型放进律师已有的文档、审查和责任流程中。访谈重点讨论了以真实使用场景更新评测、选择与后训练多个模型的方式，以及工程、权限治理和模型研究之间的取舍。
core_ideas:
  - 法律 AI 将条款判断、redline 和修改来源放进律师可审查的工作流。
  - Harvey 先从可重复的法律任务构建 benchmark，再用客户反馈、法律专家经验和测试结果持续修改评测。
  - 后训练前要定义适合客户的结果；法律场景有时需要长解释和可追溯的来源。
  - 文档检索和并发等工程改进能迅速扩大 agent 可见的上下文，早期往往比自训模型更直接影响体验。
  - 内部协作 agent 能否部署，取决于权限、审查规则和数据边界是否清楚。
  - 法律软件面向自助式扩张时，需要格外处理用户对结果责任的理解。
