title: 为什么这么多上市公司拒绝股票代币化？
guest: Brett Redfern、Jamie Selway
guest_role: Securitize 总裁；美国证券交易委员会交易与市场部主任
tags:
  - interview
  - strategic
summary: >
  SEC 为代币化证券交易场所推出试验性豁免，但众多上市公司选择退出 OKX ICE 的计划。Securitize 总裁 Brett Redfern 与 SEC 官员 Jamie Selway
  讨论发行人选择权、不同代币结构、价格风险和未来监管。
core_ideas:
  - 发行人可以针对不同交易场所作出选择，退出一家场所不等于拒绝所有代币化形式。
  - 股票代币的发行方式与二级市场的交易规则是两个问题；豁免主要针对符合条件的交易场所。
  - 嘉宾预期代币化可能扩大投资者覆盖并改善抵押品流动，但借贷不在此次交易豁免范围内。
  - 自动做市、周末参考价格不足以及合成代币的交易对手风险，都会影响投资者面临的风险。
  - SEC 官员预计在2027年提出规则提案，具体安排仍取决于试验经验和反馈。
