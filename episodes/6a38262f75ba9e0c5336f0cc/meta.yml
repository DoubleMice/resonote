summary: |
  这期串台从马斯克特色估值切入，讨论 SpaceX 的现有业务、创始人溢价，以及火星叙事如何影响资本、员工和公众的判断。嘉宾既承认 Starlink 与可回收火箭带来的执行记录，也保留了对远期估值、流动性和幸存者偏差的怀疑。
core_ideas:
  - 节目用一项思考实验区分 SpaceX 的既有业务与马斯克本人承载的远期预期。
  - 支持者与批评者围绕技术突破、财富集中和政治立场形成强烈分化。
  - Starlink 在节目中既是远海通信的具体服务，也是为发射能力创造需求的业务环节。
  - 火星愿景能动员人才和资本，但工程、现金流、流动性与继任风险仍需单独面对。
