summary: |
  本期晚点聊对话演语科技 Evoken 创始人陈冕。这家公司以 20 亿美元估值、单笔 3 亿美金融资成为"目前中国 AI 应用公司里最成功的那个"，同时又是"最具有争议性的公司"——被质疑缺少原创度、靠激进定价换增长，甚至有投资人说它"迟早会爆雷"。陈冕用数据回应两个"神奇误解"：公司现金流从 5 月起转正却被传爆雷，收入仅约 3-4% 来自投流却被说疯狂买量。他拆解了 LibTV"3.9 折"年包的健身房模式与定价算法，提出"阶段性低毛利"哲学（应用层毛利短期不超过 30%）。访谈回溯了他最接近死亡的时刻：与吐司的战争烧掉 300 万美金、投资到账那天账上只剩 4000 块、GPT-4o 发布让新流产品"赖以生存的土壤被刨"。他也完整讲述了自己的战略框架——三国战略（巨头逐鹿中原、创业公司一统江东）、时间换空间、用用户规模摆脱"地心引力"（模型厂商），以及对 AI 时代"idea is cheap、judgment 稀缺"的认知。这是一份关于"活下来"的极限生存手记。
core_ideas:
  - '双面性：以 20 亿美元估值融资 3 亿美金的"最成功"应用公司，同时被质疑缺原创度、激进定价、迟早爆雷'
  - '两个"神奇误解"：现金流 5 月起为正却被传爆雷；收入仅约 3-4% 来自效果广告却被说疯狂投流（每月约 100 万人民币）'
  - '3.9 折真相：LibTV 的折扣是月费折年包，不是模型 API 打折转卖；定价是成本→积分→价格带→消耗率×续费率→LTV 的算法链'
  - '健身房模式：年卡赌的是"绝大多数用户全年用不完"，工具产品的周活属性让这个假设大概率成立'
  - '阶段性低毛利哲学：芯片毛利八九成、应用层毛利短期不超过 30%——"你追求很高的毛利，你就会压制需求"'
  - '最接近死亡的时刻：与吐司的战争三个多月烧掉 300 万美金；拒绝融资 all-in 打仗；投资到账那天账上只剩 4000 块'
  - 'GPT-4o 危机与范式跳变：节点式工作流被模型内化，产品从"搭工作流"转向"给 context"，Lovart 三个月上线'
  - '三国战略：巨头逐鹿中原时创业公司一统江东；用时间换空间、用资源浇筑壁垒，把用户网络修成长江天险'
  - '地心引力理论：模型厂商是压在应用公司身上的引力，只有用户规模沉淀出不可替代的价值才能逃逸'
  - 'idea is cheap：Vibe Coding 让实现变便宜，judgment（哪个 idea 是哪个 timing 的 best choice）成为创业公司最重要的杠杆'
