summary: |
  Atlas 与吴伟解释系统化交易、做市及市场模型的运作，并讨论算力和深度学习如何改变量化研究。他们也分析市场数据的噪声与验证难题、交易执行和风控，以及大公司和小团队各自可能拥有的优势。
core_ideas:
  - 系统化交易由模型和系统执行决策，主观投资者也可借助 AI，但最终由人决定交易。
  - 市场数据虽多，有效独立信息却有限；短期盈利和历史回测都不足以单独证明策略可靠。
  - 预测信号还需经过仓位控制和订单执行，交易本身也可能改变市场价格。
  - 新模型需要发现能补充现有模型的信号；算力有助于实验，但不能消除市场噪声和验证延迟。
  - 大型机构在数据、算力和执行系统上有积累，小团队可能在容量有限的特殊场景找到机会。
