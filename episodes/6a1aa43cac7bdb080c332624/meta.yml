title: 一切都是Vibe的时代，小红书为什么要去买世界杯？---串台翻转体育
guest: 邓老师、苗老师（转录中的称呼）
guest_role: 节目讨论者
tags:
  - panel
  - quick-take
  - strategic
summary: >
  节目从小红书购买世界杯版权谈起，讨论大型赛事版权在算法分发时代的价值：没有版权的平台也能制造话题，但直播入口、内容运营与社区氛围仍可能改变用户去向。对话同时回看体育垂类社区的困境、B站的渐进式切入，以及版权价格未来是否还有足够多的接手者。
core_ideas:
  - 赛事版权不再是平台参与世界杯的唯一入口；它的回报取决于直播之外能否留住用户与创作者。
  - 短视频和社区平台把比赛扩展为二创、人物故事与生活方式内容的来源，改变了年轻观众进入体育的路径。
  - 推荐算法满足了许多日常兴趣需求，体育垂类社区因而更难同时维持深度讨论、广泛用户和平台规模。
  - 节目认为小红书的社区氛围可能改变体育讨论的表达方式，但大型赛事流量能否被妥善承接仍待观察。
  - 小红书与B站都在靠近体育内容；前者直接押注世界杯，后者从NBA官方账号和小站等方式逐步切入。
