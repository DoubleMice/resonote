summary: |
  明浩以资本市场和产品数据为线索，梳理 AI 投入、模型价格、云服务收入与工作智能体的早期使用情况。他反复区分访问、安装、日活、ARR 和付费用户等不同口径，也把训练数据、强化学习环境和实验循环放进应用生态中观察。
core_ideas:
  - 头部科技公司的资本开支持续上调，新增投入最终仍要由云服务和模型收入支撑。
  - 模型降价不必然等于毛利率同步下滑，但价格与能力的组合会淘汰更贵且更弱的产品。
  - WorkBuddy 的访问量、PC 端安装量和日活属于不同指标，不能直接当作同一条用户漏斗。
  - 中国 AI 办公产品仍在早期推广阶段，付费用户规模与既有月活之间存在明显距离。
  - AI 应用之外，训练数据、强化学习环境和软件基础设施也在承接增长。
