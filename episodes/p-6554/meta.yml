  - researcher
  - deep-dive
summary: >
  精神病学史学者 Andrew Scull
  回顾收容所、优生学、身体治疗、精神分析和精神药物的历史，解释治疗承诺如何受到证据与制度条件的检验。他讨论诊断分类、药物副作用和社区照护的局限，也保留了电痉挛治疗、心理治疗及药物帮助部分患者的证据与经验。
core_ideas:
  - DSM 的症状标准有助于医生取得一致诊断，但一致不等于分类已经揭示共同病因。
  - 早期收容所的治愈承诺未能实现，长期拥挤和退化论为隔离、绝育及更严重的迫害提供了条件。
  - 脑叶切除和胰岛素昏迷等疗法说明，强烈的干预和乐观的疗效宣称都不能代替可靠证据。
  - 现代电痉挛治疗与早期做法不同，部分严重抑郁患者可能受益，但记忆问题和其他风险仍须重视。
  - 精神药物与心理治疗能帮助部分患者，疗效和副作用存在个体差异；药物治疗需要谨慎监测。
  - Scull 主张研究生物机制的同时改善社区照护，并关注家庭、社会联系及患者的生活条件。
