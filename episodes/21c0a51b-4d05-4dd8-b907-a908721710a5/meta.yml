summary: |
  Martin Shkreli 在 TBPN 上拆解 Situational Awareness 基金崩塌：一只 450 亿美元、重仓 Anthropic 的 AI 杠杆基金如何在 48 小时内被强制清盘。他讲了华尔街「对着基金开枪」的狩猎传统、上千亿仓位无法一键卖出的平仓机制、Citadel 接盘资产背后的算盘，以及从 Kelly 准则到 Tim Cook 的仓位管理教训。
core_ideas:
  - 一只 450 亿美元、重仓 Anthropic 的 AI 杠杆基金在一周内被强制清盘，公开持仓被以 20–50% 的折扣打包接走
  - 决定价格的是边际 5% 的交易：4 倍杠杆之下，25% 的回撤就足以让净值从 350 亿缩水到 50 亿
  - 上千亿美元的仓位没有「一键卖出」：做市商广告、电话排查、银行强卖，最终需要能持有五年的接盘者
  - 从 Manhattan Fund 到 .com 再到 Tiger 热潮，每一代泡沫都在重演同一个剧本，只是这次压缩进了一个月
  - Kelly 准则证明 55% 胜率的最优仓位只有 10%，而几乎所有交易者都在超仓 2–10 倍
  - 在人人 FOMO 的时候，唯一说「不是我，什么都不做」的是 Tim Cook
