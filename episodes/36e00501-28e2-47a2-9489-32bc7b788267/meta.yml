summary: |
  晚点聊第 174 期，南齐对话 SAP 大中华区总裁原欣：从股价从 300 美元回落到 160 美元谈起，拆解 AI coding 对 SAP 几亿行代码的冲击边界——代码可以复刻、业务逻辑才是壁垒；SaaS 按座席收费的定价模式正在坍塌，向按用量、按结果（RaaS）迁移；模型即产品在 To B 不成立，财务场景 99% 准确率也不可用；FDE 热潮是 AI 从小圈子外溢到企业天地的必经路线，而组织惯性是比技术更大的挑战。最后落到中国企业的分化：88% 的企业在用 AI，只有 3% 觉得有业务回报——出来混总是要还的。
core_ideas:
  - 'SAP 的自我定位：1972 年创立的 ERP 巨头，去年收入约 420 亿美元，全球百强里 99 家是它的客户；2025 年蓝宝石大会提出 Autonomous Enterprise，目标是把 SAP 从记录型系统变成可执行系统'
  - 'AI 对老牌企业软件的冲击分两层：单点 SaaS 被直接替代（Adobe 从约 480 跌到 220、Zoom 大部分跌没），更大的冲击是 SaaS 按座席收费的定价模式坍塌，未来转向 consumption-based 甚至 RaaS（按结果收费）'
  - 'AI coding 一天约两万行，而 S/4HANA 有数亿行代码：数量级差万倍，但只是复刻代码本身其实是简单的——沉淀在标准流程里的业务逻辑才是更难撼动的壁垒'
  - '模型即产品在 To B 不成立：财务场景里 99% 的准确率也不可用，数据清洗、流程梳理、业务理解这些脏活累活逃不掉，human in the loop 在未来五到十年仍是主流'
  - 'FDE（前向部署工程师）是 AI 从小圈子狂欢外溢到 enterprise 天地的必经路线：传统业务顾问与产品工程师两种能力正在合并，懂技术又懂业务的转化器最稀缺；组织惯性是比技术更大的挑战'
  - '中国企业 AI 渗透分化：88% 的企业在用 AI 做项目，只有 3% 觉得真正有业务回报；追逐 top line 留下的底层系统欠账，AI 不会自动补上——它不是个弯道超车的逻辑，出来混总是要还的'
