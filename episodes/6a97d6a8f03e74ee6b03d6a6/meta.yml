summary: >
  李明昊回顾小宇宙先声活动上的一场现场演讲：他把 8 月收集到的 AI 图表逐页展示，让听众先感受信息流的密度、速度和彼此冲突的指标。演讲从资本开支、云收入、模型价格、Agent
  用量讲到个人知识管理，重点是为每张数据保留时间和口径，并用个人标准把素材整理成可解释的故事。
core_ideas:
  - 演讲用 76 页图表展示一个月的 AI 信息流，强调素材本身也值得被审视。
  - 云收入增长与 Capex 扩张并存，但现金流、毛利和循环融资提供了另一组约束。
  - 模型价格、发布频率、本地部署追近速度与 Agent Token 占比，刻画了竞争节奏的变化。
  - 图表有明确的截止日期；不同指标在不同层级和时点可能给出相反的信号。
  - 个人 Agent 的价值取决于自己的 Loop：收集、判断、输出，再开始下一轮。
