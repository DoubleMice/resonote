summary: |
  李超讲述了体育 AI 创业从扩张到收缩、处理诉讼与债务后，如何在 18 个月里将自媒体、工具开发和企业服务做成一人业务结构。他把产品灵感放回高频使用，把企业 AI 改造的重点放在团队日常使用，并分享了私募基金和专业服务行业的落地观察。
core_ideas:
  - 创业的融资、定制项目与扩张选择会在业务收缩时留下长期责任。
  - 30 个应用挑战从自己的高频需求出发，公开记录了从想法到用户反馈的过程。
  - 一人公司是一种当前工作形态；合适的合作者比维持单人标签更重要。
  - 企业 AI 改造要让团队成员每天使用工具，管理层试用和正式接入都不等于落地。
  - 私募基金适合用 AI 扩大信息处理范围，但投资回报不能简单归因于模型。
  - 靠近一线研究者并亲手实践，有助于发现公开内容之外的技术优先级。
