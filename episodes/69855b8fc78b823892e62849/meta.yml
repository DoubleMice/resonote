summary: |
  一场元宝红包链接被限制传播的事件，牵出春节期间 AI 应用争夺用户入口的不同路线。圆桌比较了豆包的低摩擦交互、千问的生活服务整合与元宝的活动导流，也讨论了大公司在组织协同、模型投入和产品孵化上的约束。
core_ideas:
  - 元宝红包活动迅速占满群聊，但节目没有留存数据，无法把短期传播直接当成长期增长。
  - 嘉宾把 2015 年微信红包后的绑卡与支付场景扩张，作为观察 AI 红包活动能否沉淀的历史参照。
  - 豆包强调语音、多模态和快速反馈；千问试图把聊天入口接到生活服务；元宝仍需说明红包之后的独立价值。
  - AI 应用竞争也取决于公司能否协调业务、探索模型边界，并给新产品足够的资源和耐心。
