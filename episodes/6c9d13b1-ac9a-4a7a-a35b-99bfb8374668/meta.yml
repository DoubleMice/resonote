summary: |
  硅谷 101 对话 Radix Arc 联合创始人兼 CEO 盛颖：从江西到斯坦福的形式化验证博士，到 xAI 推理系统搭建者，再到把开源推理引擎 SGLang 变成一家拿下 1 亿美元种子轮的公司。她谈 infra 的美学与"浪漫"、xAI 的"无边界"文化、开源社区如空气般的存在感，以及她希望用一生推进的平权事业。
core_ideas:
  - 'SGLang 是盛颖博士生涯的"收官之作"：从第一天就瞄准 production ready，如今跑在全球数十万张 GPU 上，每天为谷歌、微软、英伟达、xAI 生成数万亿 token'
  - '她的方法论底色是形式化验证与数学：infra 是"确定性的，基于数学的，然后基于代码"，与她的思维习惯最接近'
  - 'xAI 给她的两样东西是 support 和 freedom；"没有边界的文化"让她看见全栈——"你在那里待了一年，你可能在外面是好几年才能拿到的成长"'
  - '差两个月拿到第一年 vesting 仍选择离开 xAI：SGLang 的社区需求到了"中空的状态"，不填补就会让外界失望'
  - 'Radix Arc 的愿景是把 infra 做成工具箱——"基础模型也是infra"，inference 与 RL 只是末端起点，最终使命是"下一代AI"'
  - '开源于她是"空气"：江西小城靠互联网陌生人学编程的经历塑造了她；她追求 AI 权力均等——"闭源它存在但不centralize"，并把 LMSYS 与平权当作终身事业'
