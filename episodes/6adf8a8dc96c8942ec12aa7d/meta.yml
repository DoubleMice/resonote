summary: |
  明浩回顾 2026 年 AI 模型能力、成本和安全的变化，并讨论应用竞争、数据中心投资与融资风险。面对频繁发布的个人智能体，他也分享了创造性工作受到影响的感受，以及产品热度与实际需求之间的落差。
core_ideas:
  - 模型能力需要结合具体任务、使用成本和安全条件评估，单项榜单分数不能说明全部变化。
  - OpenRouter 平台数据显示，开源模型的 token 用量与闭源模型的用户支出占比呈现不同结构，平台数据不能代表全行业。
  - 独立应用仍有发展空间，但榜单覆盖范围和单家公司的经营结果都不能代表整个赛道。
  - AI 基础设施投资带动数据和云服务需求，也让借债、担保和项目融资的风险相互关联。
  - 个人智能体的潜在用途不少，网站访问、隐私和真实任务需求仍影响实际使用。
