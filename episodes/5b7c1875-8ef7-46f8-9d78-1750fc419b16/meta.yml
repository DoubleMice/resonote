summary: |
  2026 年 7 月 30 日的 TBPN 多嘉宾特别节目，覆盖了 AI 对冲基金 Situational Awareness 的史诗级爆仓分析、Guillaume Verdon 的热力学计算突破、法拉利首款电动车的市场表现、Simily 与 K2 Space 的巨额融资、Robinhood 的 13 条业务线进化，以及创始人沟通策略的深度拆解。Martin Shkreli 独家还原了从杠杆设计到强制平仓的完整链条。
core_ideas:
  - 'Leopold Aschenbrenner 的 AI 对冲基金 Situational Awareness 因 4 倍杠杆在市场 25% 回调中爆仓，Citadel 的 Ken Griffin 接盘。Martin Shkreli 详细拆解了杠杆机制、Kelly 准则、大宗头寸平仓流程，以及 Citadel 正在成为新一代"影子央行"的趋势'
