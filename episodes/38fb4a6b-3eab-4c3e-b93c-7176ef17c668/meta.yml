summary: |
  本期晚点聊对谈 Recursive Superintelligence 联合创始人田渊栋，深度拆解 RSI（递归自进化）为什么从去年的冷门概念变成今年硅谷的共识性话题：coding agent 变强、模型能充当研究员，让「AI 改进 AI」的闭环第一次有可能成立。田渊栋分享了他去年八月与 GPT-5 合写论文时看到信号、决定创业的契机，分析 Anthropic 与 OpenAI 的公开时间表，并指出「率先实现 RSI 就会强者愈强」这个假设的漏洞——他推演进步是 S 型曲线加平台期，scaling law 不是全部。节目还详细解读了该公司 First Steps 三个 benchmark 的 SOTA 成果，以及他作为可解释性少数派的信念：AI 终将变成科学。
core_ideas:
  - 'RSI 的闭环第一次可能成立：coding agent 变强、模型能充当研究员，找到模型弱点并优化——但前提是模型本身足够强'
  - '创业契机：去年八月与 GPT-5 合写 Grokking 论文，「模型的能力已经基本上强到让我觉得我可以不用招实习生了」'
  - '研究循环的加速：传统导师—学生循环以天为周期，现在被压缩到几分钟，甚至更短的时间'
  - '「强者愈强」假设的漏洞：如果 scaling law 是全部，初创公司没机会；但他推演进步是 S 型曲线加平台期，每个平台对应一次突破'
  - 'First Steps 成果：一个通用系统在 nanoGPT BPP、speed run（79 秒到 77 秒）、算子优化三个 benchmark 上达到 SOTA'
  - '少数派的信念：大模型一定存在好的 principle 可以解释，AI 终将变成科学——像炼金术变成化学、从第谷到牛顿'
