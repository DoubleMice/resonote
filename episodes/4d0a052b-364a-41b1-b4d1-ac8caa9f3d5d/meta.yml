  TBPN 多嘉宾特别版，涵盖当天四大新闻和四场深度访谈。Google DeepMind 同日失去 CEO、CTO 和首席科学家——Demis Hassabis 转任 Alphabet 首席科学家，Jeff Dean 离开 27 年的 Google 创办 Discovery Loop。Shopify 的 Harley Finkelstein 分享代理商务的爆发数据：AI 驱动流量和订单均涨 3 倍。BlackBerry CEO John Giamatteo 讲述从手机到汽车 OS 的转型，QNX 驱动 2.75 亿辆车。Circle CEO Jeremy Allaire 描绘代理劳动市场的蓝图。Ambrook CEO Mackenzie Burnett 展示实体经济 AI 落地的真实案例。同期覆盖亚马逊雨林 LiDAR 考古发现、中国实验猴价格翻倍等快讯。
