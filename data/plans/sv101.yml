      22:20 秘鲁禁捕鳀鱼，受波及的除了日料水产，还有宠物食品


      25:10 都说厄尔尼诺导致减产，但也有产区因它收益


      极端气候之外，生产资料的供应紧张和农民的应对之策


      27:53 作物减产是否影响终端价格，还要看产区和出口集中度


      29:52 推高全球粮食价格的，还有供应紧缺的氮肥


      32:27 大宗商品期货交易员会有哪些工具关注气候变化


