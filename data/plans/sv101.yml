      【延伸阅读与相关术语】

      核酸药物 以DNA、RNA或其类似物为核心的一类药物，通过补充、调控或沉默遗传信息来治疗疾病。mRNA、小核酸等都属于核酸药物。

      小核酸 通常指较短的寡核苷酸药物，多通过与目标RNA配对，调控或抑制特定基因的表达。mRNA通常不归入“小核酸”范畴。

      mRNA（信使核糖核酸） 可以理解为细胞里的临时“蛋白质生产指令”，把遗传信息交给细胞的蛋白质合成系统，指导制造特定蛋白。

      个性化肿瘤疫苗 根据每位患者自身的肿瘤突变“量身定制”疫苗，训练免疫系统识别并攻击其肿瘤。它属于治疗性疫苗，不是给健康人预防癌症的疫苗。

      CMC Chemistry, Manufacturing and Controls，药物的工艺开发、生产与质量控制体系，决定一种药能否稳定、合规地从实验室走向临床和商业化。

      核酸递送 把核酸药物安全、稳定地送进目标细胞，并在正确位置释放。由于RNA本身容易降解、也很难直接进入细胞，递送是核酸药物的核心技术之一。

      LNP（脂质纳米颗粒） 由多种脂质自组装形成的纳米级载体，可以理解为mRNA的“运输胶囊”：包裹并保护mRNA，帮助它进入细胞。

      GalNAc N-乙酰半乳糖胺，一种能“精准找到”肝细胞的糖分子，常与小核酸连接，用于实现肝脏靶向递送。

      三期临床试验 药物上市前最关键的大规模验证阶段之一，通常用于进一步确认疗效和安全性，并与现有治疗或对照方案进行比较。

      PD-1（程序性死亡受体 1） 位于 T 细胞表面，可以理解为免疫系统的“刹车”。很多肿瘤细胞会在表面表达 PD-L1，与 T 细胞上的 PD-1 结合后，传递抑制信号，从而降低它的活性，借此逃避免疫系统的追杀。抗 PD-1 药物通过阻断这条通路，让免疫系统重新攻击肿瘤。

      RFS（Recurrence free survival）无复发生存期，通常指治疗或手术后，到肿瘤复发或死亡的时间。

      免疫原性 一种物质激发人体免疫反应的能力。疫苗通常希望产生足够强的免疫原性。

      免疫耐受 免疫系统对某种抗原“不攻击”或反应较弱的状态。肿瘤可以利用这种机制逃避免疫系统的清除。

      Neoantigen 新抗原，肿瘤细胞发生基因突变后，会制造出一些正常细胞里没有的蛋白质。免疫系统有机会把这些“从没见过的蛋白质”识别为异常，并攻击产生它们的肿瘤细胞。

      In Vitro Transcription（IVT） 体外转录，以DNA为模板，在无细胞体系中合成mRNA，是目前mRNA药物生产中的核心步骤。

      SOC（Standard of Care） 标准治疗，即当前临床上普遍认可、常规采用的治疗方案，也是新疗法常用的比较基线。

      DC疗法 又称树突状细胞疗法，通常把患者自身的树突状细胞取出，在体外加载肿瘤抗原后再回输，用它们“教会”T细胞识别并攻击肿瘤。

      Off-the-shelf 现货型疗法，固定配方、可以提前批量生产，并用于多个符合条件的患者；相对的是“一人一药”的个性化治疗。

      Driver Mutation 驱动突变，能够直接推动肿瘤发生、生长的关键基因突变。并不是所有肿瘤突变都是驱动突变。 这里后面提到的 EGFR、KRAS，都是常见的肿瘤驱动基因。

      CAR-T 把患者的T细胞取出，在体外进行基因改造，让它们拥有识别特定肿瘤抗原的“雷达”，再回输患者体内杀伤肿瘤。

      CRS 细胞因子释放综合征，免疫细胞短时间内被大量激活并释放细胞因子，引发发热、低血压等全身炎症反应，是CAR-T等免疫疗法的重要副作用之一。

      可电离阳离子脂质 LNP最关键的成分之一。在生理环境下大多接近中性，进入细胞内的酸性环境后会带正电，从而帮助mRNA释放到细胞质，同时降低毒性。

      pre-F 融合前F蛋白，RSV的F蛋白在病毒与细胞融合之前的结构状态，是RSV疫苗非常重要的抗原靶点；针对pre-F可以诱导较强的中和抗体反应。

