    summary: |-
      2026年8月，Moderna与默沙东联合开发的个体化mRNA肿瘤疫苗公布三期临床积极结果，Moderna股价一度暴涨177%。这不是一款预防癌症的疫苗，而是一种为患者量身定制的治疗性疫苗。“一人一药”，似乎正在离现实越来越近。

      这期视频，我们邀请到艾博生物创始人、CEO英博博士，他曾在Moderna从事mRNA相关的核心研发。我们从这次三期临床结果出发，拆解个体化肿瘤疫苗究竟如何工作、为什么要与PD-1联合使用，以及它真正证明了什么、还有哪些问题没有被证明。我们也会聊到Moderna、BioNTech以及中国公司正在探索的不同技术路线，以及“一人一药”背后真正困难的制造、自动化、成本与监管问题。

      肿瘤疫苗为什么研究了二三十年，直到今天才跨过这道关键门槛？AI究竟能在新抗原预测和疫苗设计中解决多少问题，它真的能让肿瘤疫苗变成一个“软件问题”吗？如果每位患者都需要一支不同的药，这套系统又如何服务成千上万甚至更多患者？我们距离“为每一个癌症患者定制一支疫苗”，究竟还有多远？

