    summary: >-
      这个夏天，来自全球各地的多个气象机构都拉响了同一个警报，一场史无前例的超级厄尔尼诺正在上演。


      来自摩根大通的经济学家预计，全球的食品通胀将在2027年的上半年上升到5%，明显高于今年同期的2.8% 。这其中有来自霍尔木兹海峡封锁和黑海冲突的因素，也部分归因于我们正身处的这场、50年来颇为罕见的超级厄尔尼诺。


      它究竟会通过什么方式影响到全球供给？它所带来的危害是否真的像媒体报道的那么大？在一次次与极端气候变化的对抗中，人们又为应对厄尔尼诺做了怎样的准备？


      【主播】


      麻花，硅谷101特约研究员


      【嘉宾】


      张思齐，资深大宗商品期货交易员


      【你将听到】


