      巴拿马运河和全球铜矿的减产，厄尔尼诺要背多大的锅


      47:02 极端气候带来的干旱，让巴拿马运河的运力更紧张了


      50:23 全球铜矿产量下降的锅，厄尔尼诺背不了太多


      56:25 做服装的人，也在厄尔尼诺面前为难了


      57:41 被极端气候影响的电力、加工食品和保险行业


      59:48 大宗商品交易门外汉，可以怎么观察这个行业


