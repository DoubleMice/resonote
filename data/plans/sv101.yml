      19:26 哪些终端商品，价格可能受到大波动


      22:20 秘鲁禁捕鳀鱼，受波及的除了日料水产，还有宠物食品


      25:10 都说厄尔尼诺导致减产，但也有产区因它收益


      极端气候之外，生产资料的供应紧张和农民的应对之策


      27:53 作物减产是否影响终端价格，还要看产区和出口集中度


      29:52 推高全球粮食价格的，还有供应紧缺的氮肥


      32:27 大宗商品期货交易员会有哪些工具关注气候变化


      35:25 不确定性对于期货交易，究竟是好是坏


      40:08 与不确定性对抗多年，农民如何应对极端气候变化


      42:07 上有厄尔尼诺，下游农民活用期货


      45:22 气候变化引起的出口限制，可能进一步加剧供给危机


      巴拿马运河和全球铜矿的减产，厄尔尼诺要背多大的锅


      47:02 极端气候带来的干旱，让巴拿马运河的运力更紧张了


      50:23 全球铜矿产量下降的锅，厄尔尼诺背不了太多


      56:25 做服装的人，也在厄尔尼诺面前为难了


      57:41 被极端气候影响的电力、加工食品和保险行业


      59:48 大宗商品交易门外汉，可以怎么观察这个行业


