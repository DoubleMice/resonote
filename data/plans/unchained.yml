      Stripe bought OpenRouter this month in one of the cleanest crypto-to-AI pivots yet, and Erik Voorhees says most of
      the industry drew the wrong lesson from it.


      Voorhees, founder and CEO of Venice AI, joins Kain Warwick and Taylor Monahan to argue that crypto's job was never
      to serve crypto people, it was to become the financial rails a decentralized AI future actually needs. He pushes
      back on the instinct to abandon tokens for pure AI plays, and on the assumption that America deserves to win the
      AI race just because it is America.


      They get into why Voorhees sold Venice's equity but refused to sell its VVV tokens, why he says the big labs are
      losing money "hand over fist" subsidizing $200-a-month plans, how DeepSeek reset the cost curve for inference, and
      why he calls the moderation layer sitting inside today's AI models "deceptive."


      His answer for who should actually win the AI race has nothing to do with flags.


