      Treasury Secretary Scott Bessent has declared "economic D-Day" on Iran, leaving an open question over whether the
      sanctions crackdown reaches Uniswap and Ethereum or stops at Iranian exchanges, where humans are in the loop.


      Kain Warwick and Taylor Monahan take that gap to Peter Van Valkenburgh, executive director of Coin Center, whose
      defense of the Tornado Cash developers rests as much on zero knowledge cryptography as on sanctions law.


      They cover the GENIUS Act's freeze and seize rules for the stablecoin secondary market and Roman Storm's retrial,
      now pushed to April 2027, where speech protections clash with prosecutors' "frying pan" theory of money
      transmission.


      The SEC's proposed exemptions, the stalled Clarity Act, and Trump’s Hyperliquid all raise the same question: where
      does decentralization end and regulation begin?


