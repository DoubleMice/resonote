      North Korean hackers pulled roughly $6 billion out of Binance, and within minutes Tether and Circle were freezing
      stablecoins as the attackers raced to swap into ETH, routing part of the haul through Aave.


      Adam Sadowski, CEO of LlamaRisk, Aave's risk provider, joins Kain Warwick and Taylor Monahan to walk through the
      overnight market freeze, why nothing was stolen from Aave, and whether anyone should be able to deposit $1 billion
      and borrow all the ETH in a single block.


      They also cover Aave's 4-of-7 guardian multisig, AI agents hunting for exploits, why Kain says there is no such
      thing as the price of an asset, how an AI model helped Synthetix recover 9 million stolen SNX, and Taylor's
      warning after THORChain processed nearly $200 million for North Korea despite an FBI callout. Once a protocol has
      the power to stop a theft, can it still choose not to?


