      Genuine Ledger devices sold through the reseller CryptoBilis shipped with an LTE chip and eSIM wired inside,
      intercepting seed phrases on their way to the screen. The losses are estimated at $70 million to $100 million over
      roughly four months.


      Kain Warwick, Taylor Monahan, and Austin Griffith trace how the implant passed Ledger's genuine check, why
      panicked users are now losing money to phishing and fake apps, and whether an iPhone or a DIY build makes a better
      hardware wallet.


      They also cover the recording device planted in OpenAI's office, the decade-old XRP infinite mint bug that earned
      a $250K bounty, and why Taylor finds Google's Chrome payouts and $40K compute bills the more interesting math.


      Then StarkNet's talk of becoming an L1 turns into a debate over whether Ethereum will need L2s at all. Kain's
      answer: the most Ethereum-equivalent chain is Ethereum itself.


