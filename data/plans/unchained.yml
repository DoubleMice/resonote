      ========================================================


      A Bitcoin sidechain lost $300 million to a consensus bug this week, and the hackers who returned 85% of it are
      trying to extort a "bug bounty" out of Blockstream for the rest.


      Alex Thorn, Head of Firmwide Research at Galaxy, and Jon, Head of Strategy at Venice and co-founder of ShapeShift,
      join Kain Warwick and Taylor Monahan to unpack how AI models are now finding exploits faster than the humans who
      wrote the code, and to push back on the idea that returning stolen funds makes anyone a white hat.


      They also dig into Astra and Fable 5.1, two frontier models that landed days after a mathematician working inside
      OpenAI's Codex clashed publicly with OpenAI over who actually solved a Millennium Prize-adjacent proof.&nbsp;


      Jon and Alex explain why the "don't train on my data" toggle may not mean much, and why identity is becoming the
      real privacy battleground.


      The conversation closes on whether an Anthropic researcher quitting this week is a warning the industry is
      choosing to ignore.


