      The Clarity Act failed a Senate cloture vote 49 to 50, and Kain Warwick and Taylor Monahan open by asking what
      crypto did wrong. Taylor thinks the Trump family's memecoins and World Liberty sank it. Kain worries the industry
      squandered its best shot at actual laws and is now counting on friendly SEC rulemaking instead.


      Guest Tommy Shaughnessy, founding partner of Delphi Ventures, argues that OpenAI and Anthropic's calls to slow AI
      down are a play for a regulatory moat, because Chinese open source models like DeepSeek are getting good and
      cheap. He also explains why he runs Delphi Ventures on its own AI agent instead of handing its data to Claude or
      ChatGPT. Kain says the fear inside the labs is genuine, and that the idea of simply shutting down the data center
      won't hold forever.


      They also cover Anthropic's report on a Chinese surveillance operation that surfaced in its logs, an $8M exploit
      of a Safe wallet that a 4-year-old yoink bot frontran, the SDNY charges against Robinhood engineers accused of
      trading tokens on Hyperliquid ahead of Robinhood listings, and why Wyoming's stable token dropped LayerZero for
      Chainlink.


