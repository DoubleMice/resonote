    summary: >-
      Alex Thorn and Jon join Kain and Taylor to unpack a Bitcoin hack, two new frontier models, and why nobody trusts
      their AI chats anymore.


      ========================================================


      Thank you to our sponsors!


      Visit 1inch to swap tokenized securities, crypto and more. Simple. Secure. Self-custodial. Whatever asset you’re
