      Nvidia's board reinstated Jensen Huang after removing him over affairs, one of them reportedly with a woman US
      intelligence suspects of spying for China. Kain Warwick, Taylor Monahan, and Austin Griffith ask why a board would
      wipe out $1.2 trillion in value and then reverse course, and whether the alleged spy got Huang to do anything
      Nvidia didn't already want.


      Then SKY, the former MakerDAO, saw about $2 billion in USDS outflows after a report tied half a billion dollars of
      PSM swaps to illicit funds and stUSDS users can’t withdraw with&nbsp; founder Rune Christensen blaming a $77
      million SKY-backed loan. Kain recalls selling 30,000 ETH in 2022 to keep Synthetix from imploding.


      Taylor walks through why a record 44% of North Korea's $6.4 billion Binance haul is frozen and why the rest is so
      hard to catch, while Austin lays out why post-quantum work now outranks UX upgrades at the Ethereum Foundation.
      Kain closes on a big claim: AI labs are mispriced because they sell to the one industry they are deflating.


