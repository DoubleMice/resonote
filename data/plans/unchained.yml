      In March, a Google research team published a paper on breaking cryptographic keys with a quantum algorithm, so
      cautious about the finding that it released only a zero-knowledge proof the algorithm existed. Weeks later, an
      EigenLayer AI competition improved on that method in roughly 48 hours.


      Illia Polosukhin, co-founder of NEAR Protocol, and Charles Guillemet, CTO of Ledger, join Laura Shin for an update
      on the quantum threat whose deadline could be approaching fast. Both are creating products that deal with multiple
      chains that all have different post-quantum approaches.&nbsp;


      They discuss why, of the three NIST-standardized, post-quantum algorithms, the crypto industry has splintered into
      different chains working with different ones, whereas most industries are converging on one, called lattice-based.
      They also debate what to do with Satoshi Nakamoto's bitcoins: do nothing, freeze them, or freeze and tail-emit new
      bitcoin, an option Guillemet favors even though Bitcoin's leaderless governance makes consensus hard to reach.


