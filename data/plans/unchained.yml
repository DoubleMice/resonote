      ========================================================


      The Bitget hack reignited a fight on crypto Twitter: should chains that can stop North Korea from laundering
      stolen funds actually do it? THORChain, which DPRK hackers keep using to reach Bitcoin, landed at the center of
      it.


      Chad Barraford, co-founder of THORChain, argues the protocol cannot respond fast enough without redesigning it to
      be more centralized. Security expert Taylor Monahan counters that THORChain has acted before when its own protocol
      was at risk, and that routes made up almost entirely of stolen funds could simply be switched off.


      Laura Shin presses on the closed-source signing library, four operators running 39 nodes, why validators left
