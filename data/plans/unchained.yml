      fee burn was a meme rather than a reason for ETH to be valuable.


      Greg Markou, co-founder and CEO of Sprinter and a former Ethereum core dev, joins Kain and Austin Griffith to ask
      who should make the case for ETH the asset now, and why Greg thinks it shouldn't be Vitalik. Greg also defends
      core devs facing an AI-fueled flood of EIPs while app developers push back on gas repricing.


