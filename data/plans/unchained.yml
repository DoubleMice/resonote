      Vitalik Buterin is moving on from "ultrasound money," and Kain Warwick reads it as a concession that EIP-1559's
      fee burn was a meme rather than a reason for ETH to be valuable.


      Greg Markou, co-founder and CEO of Sprinter and a former Ethereum core dev, joins Kain and Austin Griffith to ask
      who should make the case for ETH the asset now, and why Greg thinks it shouldn't be Vitalik. Greg also defends
      core devs facing an AI-fueled flood of EIPs while app developers push back on gas repricing.


      The panel weighs the Ethereum Foundation's seppuku-clause lawsuit, picks apart the telemetry Greg says Ledger's
      signing SDK sends after a transaction is signed, and unpacks MegaETH's pivot to a marketplace for AI inference.
      Kain's bet: a multitrillion-dollar gap between AI subscriptions and API pricing is an arbitrage no terms of
      service can contain.


