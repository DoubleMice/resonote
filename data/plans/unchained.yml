      On September 24, attackers used a zero-day in a third-party security product to slip fraudulent withdrawal
      commands into Bitget's wallet system, pulling out about $388 million across chains from Ethereum and XRP to Zcash.


      Bitget CEO Gracy Chen joins Laura Shin to reconstruct the attack, from test transfers that stayed under risk
      thresholds to her team's call to switch wallets back on mid-attack and sweep hot and warm funds into cold storage.
      She lays out how the exchange's protection fund covered users and why reopened withdrawals showed an early net
      inflow.


      Then comes the industry response. Tether, Circle, and NEAR Intents froze funds, THORChain declined her request,
      and only $632K is frozen so far. Chen also describes scammers impersonating an investment firm to target her after
      the hack. Her case that "permissionless doesn't mean neutral" puts a hard question to DeFi.


