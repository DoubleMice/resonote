      Zcash just cracked the top 10 on CoinGecko, up 32% in a week and near an all-time high. NEAR is up 69% over the
      same stretch, and both rallies trace back to the same catalyst: transactions nobody else can see.


      Illia Polosukhin, co-founder of NEAR Protocol, and Mert Mumtaz, co-founder and CEO of Helius, join Laura Shin to
      unpack why confidential transactions, not speculation, are driving the rally, and why the two networks now
      function as one privacy-preserving liquidity layer for real businesses and institutions, not just traders.


      They cover NEAR Intents' $260 million in TVL, the multi-party computation and secure enclaves behind NEAR's
      confidential balances versus Zcash's zero-knowledge shielded pool, the counterfeiting bug that forced Zcash's
      Ironwood migration, and NEAR's Shield system, which halted transactions mid-hack during a Litecoin exploit.
      Zcash's next upgrade, Project Tachyon, aims to make the network quantum-proof and scale it 100x, and Mert argues
      privacy will not stay a competitive edge for long.


