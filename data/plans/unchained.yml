      North Korea only needed 20 minutes to take $6.3 billion from Binance in the largest hack in history, not just
      crypto history. According to Binance, one of the attack vectors started with a compromised developer laptop, which
      ultimately led to the attackers being able to sign transactions from the exchange's hot wallets.


      Jonty, founder of Pangolin Intelligence, and Pablo Sabbatella, founder of Opsek, trace how an EIP-7702 upgrade let
      the hackers sweep those wallets, why roughly 43% of the funds were frozen compared with less than 3% after Bybit,
      and how Circle, Tether, Arbitrum's Security Council and Aave responded. They also debate how decentralized
      THORChain really is, why the FBI named THOR node operators, and how TraderTraitor lures developers with fake job
      interviews.


      With Chainalysis tying nearly 89% of this year's reported hack losses to North Korea, Pablo and Jonty lay out the
      security and anti-laundering steps the industry could take before the next attack.


