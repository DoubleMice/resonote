      Crypto just absorbed the biggest hack in its history, a $6.3 billion theft from Binance, plus a Democratic sweep
      of Congress that dims the odds for the Clarity Act. Bitcoin barely flinched.


      Matt Hougan, Chief Investment Officer of Bitwise, tells Laura Shin why he thinks the market bottomed in June and
      why bad news has stopped mattering. He lays out three AI scenarios he says all end well for Bitcoin, why
      institutions aren't asking about hacks, and why the average Bitwise client only allocates after eight meetings.


      They also cover the quantum threat to Satoshi's coins, why a few dozen public companies opted out of tokenized
      trading, Hyperliquid as the Amazon of finance, and whether to own Bitcoin or Zcash. Hougan closes with the
      store-of-value math behind Bitwise's call for a $1.6 million Bitcoin by 2036, a forecast more bullish than
      JPMorgan's.


