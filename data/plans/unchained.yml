      Anthropic is raising $81.3 billion at a $1.5 trillion valuation in its Nasdaq IPO, with up to 20% of shares set
      aside for retail. Kain Warwick calls it a very risky IPO, existentially and financially, and says that may be
      exactly why it's hard to sit out.


      Taylor Monahan and Austin Griffith join him to size up the AI lab race: why Opus 5.5 still holds up after Fable
      5.2, how Meta and Google made big leaps, and why Tay sees Anthropic's own governance and culture as the risk she's
      least ready to accept.


      Then the hosts turn to a rough week for infrastructure: outages at Microsoft, the FAA and Apple, and an Optimizely
      injection that reached sites from Ledger to HSBC but netted about $7,000. Austin argues the slop is human-written
      code, not AI, and Tay explains why her top advice for crypto teams is now monitoring, detection and circuit
      breakers that cover the risk audits miss.


      As Kain puts it: would you rather Aave be off for an hour or a smoking crater?


