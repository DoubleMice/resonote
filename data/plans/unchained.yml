      Sixty-seven companies have opted out so far of having their shares traded on OKX ICE's tokenized stock venue, and
      a full-page Wall Street Journal ad warned CEOs that crypto would soon tokenize their stock on unregulated venues.


      Jamie Selway, Director of the SEC's Division of Trading and Markets, and Brett Redfearn, President of Securitize,
      join Laura Shin to sort out what the SEC's innovation exemption actually allows. Selway lays out its design: a
      five-year term, volume caps as low as 25 basis points, and a 30-day issuer consent window. Redfearn argues that
      tokenizing a stock and trading it on a TSV are two different things.


      They also cover the Hims & Hers token that hit $132 offshore, weekend pricing, why synthetics are off the table
      for now, and the "investomer." Selway says a rule proposal has to be a 2027 event, so the next year of trading may
      shape the rules that follow.


