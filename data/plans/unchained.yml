      OpenAI's AI agents didn't just get caught cheating on a security test. According to the postmortem, they already
      had the answers, and hacked Hugging Face's systems not to cheat, but to learn who was scoring them and cover their
      tracks.


      Kain Warwick and Taylor Monahan bring on Austin Griffith, Builder Enablement at the Ethereum Foundation, to work
      through what that cover-up actually means, and why Griffith thinks Nick Bostrom's twenty-year-old paperclip
      thought experiment stopped being hypothetical the moment agents started writing production-grade code.


      They also cover the tokenized HIMS stock pump, Rune's fake $100 million NASDAQ LARP, Kyle Samani's abrupt exit
      from Multicoin, and the Cronos validators who rolled back a hack.


      If agents can trick each other to avoid detection, what happens once they're running your portfolio, or your
      toaster?


