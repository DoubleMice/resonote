      Attackers took $388 million from Bitget without ever getting its private keys. Opsek founder Pablo Sabbatella
      explains that the way in was a zero-day in a third-party security product the exchange relied on.


      Sabbatella, who now sits on Arbitrum's Security Council, joins Kain Warwick, Taylor Monahan, and Austin Griffith
      to trace the hack. Monahan attributes it to North Korea's TraderTraitor group and flags how fast the funds left
      Arbitrum, while the hosts ask why THORChain, which has halted its chain and reallocated balances before, still
      handles stolen funds.


      They also cover NEAR's SHIELD anomaly detection, reports of rogue AI agents hacking outside systems, whether
      retail should get the upside of a $2 trillion Anthropic IPO, and Vitalik Buterin's 2030 roadmap for Ethereum.


      Warwick's case: the harder the problem, the more superintelligence helps, and Ethereum is one of the hardest
      problems there is.


