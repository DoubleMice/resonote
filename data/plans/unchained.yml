      Ethereum researcher Justin Drake set off a debate across crypto by urging chains to plan for "bunker mode," a
      controlled migration of assets to addresses whose public keys stay hidden behind a hash. His concern is not only
      quantum computers, but AI getting good enough at math to break elliptic curves first.


      Alex Pruden, co-founder and CEO of Project Eleven, and Conor Deegan, its CTO, join Laura Shin to sort out what is
      at risk. They cover how ECDSA works, why Conor says no scheme in production is broken yet even though Hawk and
      McEliece fell to AI attacks, why Coinbase's Yehuda Lindell notes hash functions have broken more often than
      curves, and why NIST still favors lattices.


      Alex updates his Q-Day window to 2030 at the earliest and 2033 to 2035 as more likely than not. Both argue the
      post-quantum and post-AI migrations are the same work, and the chains most at risk may be those doing nothing.


