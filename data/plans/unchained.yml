      For more than a year, the private key behind signatures from a certificate authority trusted across the internet
      was the number 4.


      Taylor Monahan walks Kain Warwick and Austin Griffith through how eMudhra passed two audits with eight weak keys,
      and why revoking them now runs on an email thread between Google, Mozilla, and Apple. Kain argues it fits a
      pattern: schemes that assumed nobody would bother trying, now facing AI agents that never stop.


      The hosts also cover two remote code execution bugs in PHP, Austin's $1 test that drew three competing theft
      transactions the moment it landed, papertrade's 1,000x leverage launch and its lose-to-earn token, and why
      DeepSeek keeps getting cheaper even as DHS bans it for government use. They close on Anthropic, and Kain's case
      that any frontier lab that turns cash-flow positive would be worth "infinity," a prospect he calls petrifying.


