      Anthropic has filed its S-1, and Kain Warwick stacks it up against Google's 2004 IPO: $12 billion in revenue in Q2
      2026 alone and $8.7 million in revenue per employee. What jumped out at him, though, was governance: 7 founders
      holding 50% of the voting shares in a side pot that has to vote together.


      Warwick, Taylor Monahan, and Austin Griffith say crypto has run this experiment before. Monahan calls the
      founders' sense of moral superiority Anthropic's biggest risk, and Griffith compares the bloc to every multisig
      that stalled once the incentives to coordinate faded.


      The hosts also cover how AI models started sending bug bounty disputes to SEAL 911, an AI result that says "ETH is
      false," Keystone's leaked device signing key, phishing emails sent from Foundation's own mail system, and why
      Ethereum's Glamsterdam upgrade was cancelled.


      In what Warwick calls one of the most dangerous times to be in crypto, the safest move may be doing less.


