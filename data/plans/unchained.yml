      North Korea has stolen more than $1 billion in crypto this year, AI-driven ransomware attacks have run with no
      human in the loop, and a single week exposed weak keys and bugs buried in old internet infrastructure. One answer
      gaining traction in Washington dates to the age of sail: privateering.


      Chris Giancarlo, former chairman of the CFTC and author of The New Adventures of CryptoDad, proposed reviving
      letters of marque and reprisal in a Cointelegraph op-ed with Chris Perkins, then pitched it at a White House
      crypto summit. Giancarlo and Ari Redbord, global head of policy at TRM Labs, join Laura Shin to unpack the August
      presidential memo that followed.


      They cover why the memo lets vetted contractors target scam compounds, cartels, and ransomware gangs but leaves
      Lazarus Group to the government, how the Prince Group's $15 billion forfeiture shows stolen funds can be clawed
      back, and how deepfake interviews put DPRK IT workers inside US companies. The final question: does hitting back
      make the problem bigger?


