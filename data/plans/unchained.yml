      Syncracy Capital has made a big investment in Pearl, and co-founder Ryan Watkins opened his case with a line built
      to rile Bitcoiners: for the first time in years, Bitcoin's long-term viability as a store of value is being
      tested.


      Watkins argues that with no fee market, Bitcoin's security budget now depends on its price doubling every four
      years. Pearl, which swaps SHA-256 hashing for the matrix multiplication behind AI inference, is his answer, though
      he frames it as a venture bet, not a call to flip Bitcoin.


      He walks Laura Shin through why near-zero mining overhead could pull AI clouds in, the January FP8 upgrade, duplex
      miners, and "P-Day," when his model says Pearl could pass Bitcoin's compute and energy footprint with about 12.5%
      of data center capacity. He also answers criticism of Pearl's raise and mining concentration. If he's right, AI's
      buildout could end up paying for proof-of-work security.


