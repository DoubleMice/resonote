    summary: >-
      Home Depot's founding story is like an Avengers movie… if the Avengers got fired, went broke, and stacked empty
      paint cans ten feet high to look legitimate. After being unceremoniously fired from their previous hardware chain
      at ages 48 and 35, Bernie Marcus and Arthur Blank took the words of their New York banker Ken Langone (who had
      also just accidentally caused their firings) to heart: they'd just been "kicked in the ass with a golden
      horseshoe.” They proceeded to author the greatest compounding story in American retail history, helped by some
      legendary cameos along the way from Sol Price, Jamie Dimon, and Ross Perot (to name a few). And the ending is as
      good as any superhero film: from its 1981 IPO to today, Home Depot has been the single highest-returning equity in
      the entire US stock market — higher than Apple, Microsoft, Berkshire Hathaway, and everything else!


