      01:07:00 大众与从业者之间的认知落差，行业心照不宣的“demo”工程


      01:12:50 具身测评可以被 Hack 吗？如何反制 hack？


      01:14:52 26 年想验证的问题：具身中国追平美国的 DeepSeek 时刻是否到？基模能否上一个台阶？


