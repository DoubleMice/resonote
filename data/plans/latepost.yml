    summary: >-
      「工具产品是解题，娱乐产品是出题。」


      从今年初到现在，整个 AI 领域的最大重心在 coding、生产力和工作。梁琛奇想回答另一类问题：如何用 AI 让人开心？获得一种真正新颖、长期、高频，又不容易厌倦的娱乐体验？


      在去年夏天创立「动念引线」之前，96 年出生的梁琛奇只待过一家公司：字节跳动。7 年里，他亲历了抖音在 2018 年的崛起，很快在 2021 年开始从零 lead 一个实时社交产品。再然后是 2023 年，字节成立 AI
      产品部门 Flow，梁琛奇带团队做出了猫箱。


      不管是在字节还是创业，梁琛奇的热情一直在于娱乐和内容。而现在，还没有人拿出 AI 娱乐方向的爆款产品、把无可争议的那个新体验推到人们面前。


      梁琛奇和动念引线的押注：是一种泛创作/表达，并混合轻游戏的体验。而这能否成立，取决于我们怎么想象和推演未来的自己：一种想法是，大部分人即使有闲暇，也不会投入创作，我们仍会被动地 kill
      time；而梁琛奇相信，当人不再需要为生计而工作，泛创作会变成一种普及、高频的娱乐活动。


      你的答案呢？这是内容和娱乐创业有意思的一部分。它最大的 bet，最后指向我们怎么理解自己和同类。


      图注：「松果时刻」的一位用户在给病人打点滴时发现，输液管被折成了一只蝴蝶。她用这个瞬间制作了一个小故事。


