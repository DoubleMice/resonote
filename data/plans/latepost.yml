    audio_url: https://aphid.fireside.fm/d/1437767933/19a49f52-28ee-4e25-b8e9-4f0ee70917e0/09658018-16d6-4d56-84d1-0ae52a411d64.mp3
    image: https://assets.fireside.fm/file/fireside-images-2024/podcasts/images/1/19a49f52-28ee-4e25-b8e9-4f0ee70917e0/episodes/0/09658018-16d6-4d56-84d1-0ae52a411d64/cover.jpg?v=1
    summary: >-
      「走进不同团队的成果，创新从来是连续的，不是跳跃的。」


      上周五，DeepSeek V4 发布。我们邀请了两位一线 AI 从业者一起详解 DeepSeek V4 的技术实现和创新想法。


      如果一句话概括：DeepSeek V4 并没有带来新的“范式变化”，它是继续在 R1 的“测试时扩展”范式下，用一系列组合创新和工程优化，让百万上下文从理论进入实用。


      超长上下文上的稳定表现，正是 Agent 和多步复杂任务亟需的能力之一。


      本期涉及的诸多技术术语见 Shownotes 末尾注释。


