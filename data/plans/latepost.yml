      -π 系列模型：PI 提出的通用机器人模型系列，最新版本 π*0.6。


      -CIFAR：一个经典计算机视觉数据集，相比之后出现的 ImageNet，它规模更小、分辨率更低，常用于快速实验和教学。


      -Sunday Robotics：由 Tony Zhao 与 Cheng Chi 在 2024 年联合创立的家庭场景通用机器人公司。


      -Generalist AI：2024 年成立的美国通用机器人 / 具身智能的创业公司。


