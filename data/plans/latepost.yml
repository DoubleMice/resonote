      附录：人物、机构与术语


      -Noah Shinn：Instinct 创始人，曾任 Sierra 研究科学家。Instinct 在 2026 年以邀请制个人 AI 助手迅速走红硅谷科技圈。


      -METR：一家独立研究前沿 AI 能力与重大风险的非营利机构，为模型公司开展能力评估、红队测试和事故调查。本期引用了它对 OpenAI / Hugging Face 智能体入侵事件的独立调查。


      -Tristan Buckmaster、Levent Alpöge：长期研究 Navier–Stokes 方程的数学家。两人曾合作推进相关问题，并对 OpenAI 公布的成果与未公开研究之间的关系提出质疑。


      -Artifactory：用于集中存放和分发软件包、构件的仓库系统。多智能体失控攻击 Hugging Face 事件中的 Agent 利用共享 Artifactory 目录名建立了未获授权的通信渠道。


      -RoboDojo：包含 42 项机器人操作任务的仿真评测环境。《An Unexpected Robot Policy》用它测试通用大模型能否在未经专门策略训练时，直接依据观察输出机器人动作。


