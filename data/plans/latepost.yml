    summary: >-
      「这个秋天并不冷。」


      AI 本身的进展速度已经超过了对它的理解和讨论的速度。最近几天，OpenAI Dev Day、Google 的 Gemini 4 连番登场。而我们第一次录节目还是在 DevDay 之前。


      所以本期的内容由两次录制构成：前面一部分，我们单独放了对个人助理的讨论，包含 OpenAI DevDay 之后的新信息，和第一次录时，对 Muse、Instinct
      等产品的讨论。后面是我们第一次录制的其他讨论。我自己觉得很有意思的部分有：


      多智能体的一体两面：OpenAI 用多智能体协作解决了千禧年难题，而不受控制的协作又带来了 Hugging Face 攻击事件。


      GPT-6 Astra 发布之后，具身智能领域的兴奋和害怕。我们会在 11 之后的「具身季报」里，更充分地讨论这个问题。


      本期季报的嘉宾是 MoE Capital 的创始合伙人 Henry Yin。这是一家位于硅谷的早期基金，主要投资 AI 基础设施、数据、 Agent 和机器人。取名“MoE (Mixture of
      Experts)”是因为他们有多位来自前沿 AI 实验室的研究员做个人 LP 和顾问。我们的讨论会更偏研究视角和一级市场视角。


      从 2023 年到 2025 年，大模型热潮以来，每年秋天前后都会有点儿“悲观气息”，但今年不一样，这个秋天不冷，各公司更新密集，比如刚刚发的 Gemini 4 我们这期就来不及讨论了（正好这个模型是北京时间 10 月 1
      日发布的）。我们上季与这季都讨论的 RSI，可能正在带来加速度的量变。


      祝各位《晚点聊》听友国庆快乐！


      本期嘉宾：Henry Yin，MoE Capital 创始合伙人


      本期主播：程曼祺，晚点 LatePost 科技报道负责人


      本期剪辑：甜食


