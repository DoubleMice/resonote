    image: https://risky.biz/static/img/rb-feed-main.png
    summary: >-
      In this Soap Box episode Patrick Gray chats to Push Security co-founder and CEO Adam Bateman about the benefits of
      taking a browser-centric approach to security.


      By now most Risky Business listeners know that Push sells a browser extension-based product that can reliably
      prevent phishing, ClickFix and ConsentFix. But what’s next? Where to from here once you’re already in the browser?


      Well, Push is expanding into the data loss prevention and secure web gateway product space. Why use a SWG based on
      15-year-old technology when an extension can give you an even better security result? Especially when you can drop
      the drawbacks, like tromboning all your traffic into a random data centre…


      This episode is also available on YouTube.
