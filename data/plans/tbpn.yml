      (00:10) - Warren Buffett & Charlie Munger LIVE on TBPN 🎃

      (09:01) - Binance Faces $6.3B Hack Fallout

      (15:09) - Intel Stock Crashes

      (17:35) - Polymarket Hit by Wallet Breach

      (19:36) - WSJ Mansion Section

      (23:29) - Darren Rovell discusses his passion for sports, business, and historical collectibles, drawing on his
      expertise as a collector and entrepreneur. He explores rare Warren Buffett memorabilia, autograph values, shipping
      risks, preservation strategies, and the booming market for high-end items such as sports cards, jerseys, and
      dinosaur fossils.

      (53:26) - Will Manidis discusses *Commanding Heights*, his new book co-authored with Joe Roberts, which examines
      how rapidly advancing AI could reshape national power, currencies, financial markets, businesses, and labor. He
      argues that the United States and China may dominate frontier AI, global transactions could increasingly rely on
      the dollar, and firms positioned to benefit from scaling intelligence—such as Meta—could gain significant
      advantages.

      (01:11:42) - 𝕏 Timeline Reactions

      (01:31:51) - David Senra is the creator and host of Founders, a popular business podcast where he studies the
      biographies of history’s greatest entrepreneurs, including Steve Jobs, John D. Rockefeller, and Estée Lauder.
      Through hundreds of episodes, he explores the habits, strategies, and philosophies behind building enduring
      companies, with a particular focus on founder psychology and the lessons of business history. He also launched a
      second podcast, David Senra, featuring long-form interviews with living founders and business leaders such as
      Daniel Ek, Michael Dell, and Jimmy Iovine.


