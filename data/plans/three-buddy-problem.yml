    summary: >-
      (Presented by TLPBLACK: A cybersecurity intelligence platform focused on sharing curated, high-sensitivity threat
      insights and research with trusted security professionals.)


      Three Buddy Problem - Episode 120: Calif's Bruce Dang joins the buddies to cover why his shop refuses to sell a
      $50 million iPhone exploit chain, the March 2026 moment Mythos started finding real bugs, Lockdown Mode and MIE
      bypasses, hallucinated crash logs, and why verification is now the real bottleneck.


      Plus, Google Project Zero drops a 30-day disclosure deadline mid-show, and the conversation swings to AI-written
      patches, careers for new hackers, Calif's plan to be the TSMC of hacking, Jensen Huang's exit from Nvidia, and
      where all the GReAT APT reports went.


      Cast: Juan Andres Guerrero-Saade,  Ryan Naraine and Costin Raiu.


